<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Real Write • Manager • Payments</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap wide">
      <div class="grid">
        <div class="card">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div>
              <h2 style="margin:0">Payments</h2>
              <div class="muted" style="margin-top:6px">Track pending and paid payments for your projects.</div>
            </div>
            <div class="right" style="flex-wrap:wrap;">
              <a href="/manager/projects.html"><button class="secondary" type="button">Projects</button></a>
              <a href="/manager/review.html"><button class="secondary" type="button">Review</button></a>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>This Month</h2>
          <div class="row">
            <div class="stat">
              <div class="pill dot green">Paid this month</div>
              <div class="n" id="nPaidMonth">0</div>
            </div>
            <div class="stat">
              <div class="pill dot amber">Pending this month</div>
              <div class="n" id="nPendingMonth">0</div>
            </div>
            <div class="stat">
              <div class="pill dot blue">Payments</div>
              <div class="n" id="nPaymentsTotal">0</div>
            </div>
          </div>
          <div class="muted" style="margin-top: 8px">Current-month totals are based on payment rows created this month.</div>
        </div>

        <div class="card">
          <h2>Payment History</h2>
          <div class="two" style="margin: 10px 0 12px 0; align-items:end;">
            <div>
              <label class="muted">Project</label>
              <select id="project"></select>
            </div>
            <div>
              <label class="muted">Writer</label>
              <select id="writer" disabled></select>
            </div>
          </div>
          <div class="two" style="margin: 0 0 12px 0; align-items:end;">
            <div>
              <label class="muted">From</label>
              <input id="from" type="date" />
            </div>
            <div>
              <label class="muted">To</label>
              <input id="to" type="date" />
            </div>
          </div>
          <div class="right" style="margin: 0 0 12px 0; flex-wrap: wrap;">
            <button class="secondary" id="prevMonth" type="button">←</button>
            <span class="pill" id="monthLabel">This month</span>
            <button class="secondary" id="nextMonth" type="button">→</button>
            <button class="secondary" id="apply" type="button">Apply</button>
            <button class="secondary" id="clear" type="button">Reset</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>Article</th>
                <th>Writer</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Created</th>
                <th>Paid at</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="right" style="margin-top: 12px">
            <button class="secondary" id="prev">Previous</button>
            <span class="muted" id="pageInfo"></span>
            <button class="secondary" id="next">Next</button>
          </div>
          <div class="muted" id="msg" style="margin-top: 10px"></div>
        </div>
      </div>
    </div>

    <dialog
      id="payModal"
      style="border:1px solid rgba(229,226,225,0.95);border-radius:24px;background:rgba(255,255,255,0.9);color:var(--rw-text);padding:16px;max-width:520px;width:95%;box-shadow:var(--rw-shadow)"
    >
      <h3 style="margin:0 0 10px 0">Mark paid</h3>
      <div class="muted" id="payFor"></div>
      <div style="margin-top:10px">
        <label class="muted">Payment ID (optional)</label>
        <input id="paymentId" />
      </div>
      <div style="margin-top:10px">
        <label class="muted">Proof file (optional)</label>
        <input id="proof" type="file" />
      </div>
      <div class="right" style="margin-top:12px">
        <button class="secondary" id="cancel">Cancel</button>
        <button id="confirm">Mark paid</button>
      </div>
      <div class="muted" id="modalMsg" style="margin-top:10px"></div>
    </dialog>

    <script>
      (async function () {
        const user = await APP.requireRole("manager");
        if (!user) return;
        await renderTopbar({
          role: user.role,
          links: [
            { href: "/manager/dashboard.html", label: "Dashboard" },
            { href: "/manager/review.html", label: "Review" },
            { href: "/manager/payments.html", label: "Payments" }
          ]
        });

        const msg = (t) => (document.getElementById("msg").textContent = t || "");
        const modal = document.getElementById("payModal");
        const modalMsg = (t) => (document.getElementById("modalMsg").textContent = t || "");
        document.getElementById("cancel").onclick = () => modal.close();

        APP.ui.textSkeleton("nPaidMonth", { kind: "num", width: "54%" });
        APP.ui.textSkeleton("nPendingMonth", { kind: "num", width: "54%" });
        APP.ui.textSkeleton("nPaymentsTotal", { kind: "num", width: "54%" });
        APP.ui.textSkeleton("pageInfo", { kind: "line", width: "120px" });

        const pageSize = 20;
        let offset = 0;
        let total = null;
        let currentPayment = null;
        let pageCache = [];
        let currentMonth = new Date();
        let projectId = "";
        let writerId = "";

        const startOfMonth = () => {
          const d = new Date();
          return new Date(d.getFullYear(), d.getMonth(), 1, 0, 0, 0, 0);
        };
        const inThisMonth = (iso) => {
          if (!iso) return false;
          return new Date(iso).getTime() >= startOfMonth().getTime();
        };
        const sum = (rows) => rows.reduce((a, p) => a + Number(p.amount || 0), 0);

        async function refreshStats() {
          const qs = new URLSearchParams();
          if (projectId) qs.set("project_id", projectId);
          if (writerId) qs.set("writer_id", writerId);

          const fromVal = document.getElementById("from").value;
          const toVal = document.getElementById("to").value;
          if (fromVal) qs.set("from", new Date(fromVal + "T00:00:00").toISOString());
          if (toVal) {
            const d = new Date(toVal + "T00:00:00");
            d.setDate(d.getDate() + 1);
            qs.set("to", d.toISOString());
          }

          const out = await APP.apiFetch(`/api/payments/stats?${qs.toString()}`);
          document.getElementById("nPaidMonth").textContent = `₹${Number(out.paid_amount || 0).toFixed(0)}`;
          document.getElementById("nPendingMonth").textContent = `₹${Number(out.pending_amount || 0).toFixed(0)}`;
          document.getElementById("nPaymentsTotal").textContent = String(out.payments_count ?? 0);
        }

        function renderRows(rows) {
          pageCache = rows || [];
          document.getElementById("rows").innerHTML = (rows || [])
            .map((p) => {
              const a = p.articles;
              const u = p.writer;
              const title = a?.title || "Article";
              const uid = a?.unique_id || p.article_id;
              const aStatus = a?.status || "-";
              const writer = u?.full_name || "Writer";
              const email = u?.email || "";
              return `<tr>
                <td>
                  <a href="/manager/review.html?id=${encodeURIComponent(p.article_id)}" style="font-weight:800;color:var(--rw-text);text-decoration:none;">${APP.escapeHtml(title)}</a>
                  <div class="muted">${APP.escapeHtml(uid)} • ${APP.escapeHtml(aStatus)}</div>
                </td>
                <td>
                  <div style="font-weight:750">${APP.escapeHtml(writer)}</div>
                  <div class="muted">${APP.escapeHtml(email)}</div>
                </td>
                <td>₹${APP.escapeHtml(Number(p.amount || 0).toFixed(0))}</td>
                <td>${
                  p.status === "paid"
                    ? "<span class='badge b-approved'>paid</span>"
                    : "<span class='badge b-submitted'>pending</span>"
                }</td>
                <td class="muted">${APP.escapeHtml(new Date(p.created_at).toLocaleString())}</td>
                <td class="muted">${p.paid_at ? APP.escapeHtml(new Date(p.paid_at).toLocaleString()) : "-"}</td>
                <td class="right">
                  ${
                    p.status === "pending"
                      ? `<button class="secondary" data-pay="${p.id}">Mark paid</button>`
                      : p.proof_url
                        ? `<a href="${p.proof_url}" target="_blank" rel="noreferrer"><button class="secondary" type="button">Proof</button></a>`
                        : ""
                  }
                </td>
              </tr>`;
            })
            .join("");

          for (const btn of document.querySelectorAll("button[data-pay]")) {
            btn.onclick = () => {
              const id = btn.getAttribute("data-pay");
              currentPayment = pageCache.find((x) => x.id === id);
              document.getElementById("paymentId").value = "";
              document.getElementById("proof").value = "";
              document.getElementById("payFor").textContent = `Payment for ${currentPayment?.articles?.title || "article"} (₹${currentPayment.amount})`;
              modalMsg("");
              modal.showModal();
            };
          }
        }

        function updatePager() {
          const page = Math.floor(offset / pageSize) + 1;
          const pages = total ? Math.max(1, Math.ceil(total / pageSize)) : null;
          document.getElementById("prev").disabled = offset <= 0;
          document.getElementById("next").disabled = total != null ? offset + pageSize >= total : false;
          document.getElementById("pageInfo").textContent = pages ? `Page ${page} of ${pages}` : `Page ${page}`;
        }

        async function loadPage() {
          APP.ui.tableSkeleton("rows", { rows: 10, cols: 7 });
          const qs = new URLSearchParams();
          qs.set("limit", String(pageSize));
          qs.set("offset", String(offset));
          if (projectId) qs.set("project_id", projectId);
          if (writerId) qs.set("writer_id", writerId);

          const fromVal = document.getElementById("from").value;
          const toVal = document.getElementById("to").value;
          if (fromVal) qs.set("from", new Date(fromVal + "T00:00:00").toISOString());
          // treat `to` as exclusive: next day 00:00
          if (toVal) {
            const d = new Date(toVal + "T00:00:00");
            d.setDate(d.getDate() + 1);
            qs.set("to", d.toISOString());
          }

          const out = await APP.apiFetch(`/api/payments?${qs.toString()}`);
          total = out.total ?? total;
          renderRows(out.payments || []);
          updatePager();
        }

        document.getElementById("confirm").onclick = async () => {
          modalMsg("");
          try {
            const fd = new FormData();
            fd.append("payment_id", document.getElementById("paymentId").value);
            const file = document.getElementById("proof").files[0];
            if (file) fd.append("proof", file);

            const res = await fetch(`${APP_CONFIG.apiBaseUrl}/api/payments/${encodeURIComponent(currentPayment.id)}/pay`, {
              method: "PATCH",
              body: fd,
              credentials: "include"
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(body.error || "Failed");
            modal.close();
            await loadPage();
            msg("Marked paid.");
          } catch (e) {
            modalMsg(e.message || String(e));
          }
        };

        document.getElementById("prev").onclick = async () => {
          offset = Math.max(0, offset - pageSize);
          await loadPage();
        };
        document.getElementById("next").onclick = async () => {
          offset = offset + pageSize;
          await loadPage();
        };

        function setMonth(d) {
          currentMonth = new Date(d.getFullYear(), d.getMonth(), 1);
          const from = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
          const to = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);
          const pad = (n) => String(n).padStart(2, "0");
          document.getElementById("from").value = `${from.getFullYear()}-${pad(from.getMonth() + 1)}-${pad(from.getDate())}`;
          document.getElementById("to").value = `${to.getFullYear()}-${pad(to.getMonth() + 1)}-${pad(to.getDate())}`;
          document.getElementById("monthLabel").textContent = from.toLocaleString(undefined, { month: "long", year: "numeric" });
        }

        async function loadProjects() {
          const out = await APP.apiFetch("/api/projects");
          const rows = out.projects || [];
          const sel = document.getElementById("project");
          sel.innerHTML = [`<option value="">All projects</option>`]
            .concat(rows.map((p) => `<option value="${p.id}">${APP.escapeHtml(p.title)}</option>`))
            .join("");
        }

        async function loadWritersForProject(pid) {
          const sel = document.getElementById("writer");
          if (!pid) {
            sel.innerHTML = `<option value="">All writers</option>`;
            sel.disabled = true;
            return;
          }
          sel.disabled = true;
          sel.innerHTML = `<option value="">Loading…</option>`;
          const out = await APP.apiFetch(`/api/projects/${encodeURIComponent(pid)}/writers`);
          const writers = out.writers || [];
          sel.innerHTML = [`<option value="">All writers</option>`]
            .concat(
              writers.map((w) => {
                const name = w.users?.full_name || "Writer";
                const email = w.users?.email || "";
                return `<option value="${w.writer_id}">${APP.escapeHtml(name)}${email ? " (" + APP.escapeHtml(email) + ")" : ""}</option>`;
              })
            )
            .join("");
          sel.disabled = false;
        }

        document.getElementById("project").onchange = async (e) => {
          projectId = e.target.value || "";
          writerId = "";
          document.getElementById("writer").value = "";
          await loadWritersForProject(projectId);
          offset = 0;
          await refreshStats();
          await loadPage();
        };

        document.getElementById("writer").onchange = async (e) => {
          writerId = e.target.value || "";
          offset = 0;
          await refreshStats();
          await loadPage();
        };

        document.getElementById("apply").onclick = async () => {
          offset = 0;
          await refreshStats();
          await loadPage();
        };
        document.getElementById("clear").onclick = async () => {
          projectId = "";
          writerId = "";
          document.getElementById("project").value = "";
          await loadWritersForProject("");
          setMonth(new Date());
          offset = 0;
          await refreshStats();
          await loadPage();
        };
        document.getElementById("prevMonth").onclick = async () => {
          const d = new Date(currentMonth);
          d.setMonth(d.getMonth() - 1);
          setMonth(d);
          offset = 0;
          await refreshStats();
          await loadPage();
        };
        document.getElementById("nextMonth").onclick = async () => {
          const d = new Date(currentMonth);
          d.setMonth(d.getMonth() + 1);
          setMonth(d);
          offset = 0;
          await refreshStats();
          await loadPage();
        };

        try {
          await loadProjects();
          await loadWritersForProject("");
          setMonth(new Date());
          await refreshStats();
          await loadPage();
        } catch (e) {
          msg(e.message || String(e));
        }
      })();
    </script>
  </body>
</html>
