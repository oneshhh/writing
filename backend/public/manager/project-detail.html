<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write - Manager - Project</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap wide">
      <div class="grid">
        <div class="card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div>
              <h3 id="projectHeading">Project</h3>
              <div class="muted" id="projectMeta" style="margin-top:6px"></div>
            </div>
            <div class="right" style="flex-wrap:wrap;">
              <a href="/manager/projects.html"><button class="secondary" type="button">Back</button></a>
            </div>
          </div>
        </div>

        <div class="card" style="grid-column: span 5">
          <h2>Project Settings</h2>
          <div>
            <label class="muted">Title</label>
            <input id="pTitle" />
          </div>
          <div style="margin-top: 10px">
            <label class="muted">Description</label>
            <textarea id="pDesc"></textarea>
          </div>
          <div class="two" style="margin-top: 10px">
            <label class="pill"><input type="checkbox" id="pAi" /> AI check enabled</label>
            <label class="pill"><input type="checkbox" id="pPlag" /> Plagiarism check enabled</label>
          </div>
          <div class="right" style="margin-top: 12px">
            <button class="secondary" id="saveProject">Save</button>
          </div>

          <div style="margin-top: 18px; border-top: 1px solid rgba(229,226,225,0.9); padding-top: 14px">
            <h2 style="margin-bottom: 8px">Add Writers</h2>
            <div style="margin-top: 10px">
              <label class="muted">Search</label>
              <input id="writerSearch" placeholder="type a name or email..." />
            </div>
            <div class="muted" style="margin-top: 8px; display:flex; align-items:center; gap:8px;">
              <span id="writerMiniLoad" class="hidden" style="display:inline-flex;align-items:center;gap:8px;">
                <span class="rw-spinner" style="width:14px;height:14px;border-width:2px"></span>
                <span>Searching...</span>
              </span>
            </div>
            <div
              style="margin-top: 10px; max-height: 320px; overflow: auto; border: 1px solid rgba(229,226,225,0.95); border-radius: 16px; background: rgba(255,255,255,.65)"
            >
              <table style="margin: 0">
                <thead><tr><th>Writer</th><th></th></tr></thead>
                <tbody id="writerRows"></tbody>
              </table>
            </div>
          </div>

          <div class="muted" id="msg" style="margin-top: 10px"></div>
        </div>

        <div class="card" style="grid-column: span 7">
          <h2>Assigned Writers</h2>
          <table>
            <thead><tr><th>Writer</th><th>Price</th><th>Assigned</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <div class="card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div>
              <h2 style="margin-bottom: 6px">Monthly Articles</h2>
              <div class="muted" id="monthHint"></div>
            </div>
            <div class="right" style="flex-wrap:wrap;">
              <button class="secondary" id="prevMonth" type="button">Previous month</button>
              <select id="monthSelect" style="width:auto;min-width:170px"></select>
              <button class="secondary" id="nextMonth" type="button">Next month</button>
            </div>
          </div>

          <div class="row" style="margin-top: 14px">
            <div class="stat">
              <div class="pill dot green">Approved</div>
              <div class="n" id="nApproved">0</div>
            </div>
            <div class="stat">
              <div class="pill dot red">Rejected</div>
              <div class="n" id="nRejected">0</div>
            </div>
            <div class="stat">
              <div class="pill dot amber">Rework</div>
              <div class="n" id="nRework">0</div>
            </div>
            <div class="stat">
              <div class="pill dot blue">Submitted</div>
              <div class="n" id="nSubmitted">0</div>
            </div>
          </div>

          <div style="margin-top: 16px; overflow:auto;">
            <table>
              <thead>
                <tr><th>#</th><th>Article</th><th>Writer</th><th>Status</th><th>Submitted</th><th>Reviewed</th></tr>
              </thead>
              <tbody id="articleRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <dialog id="priceDlg" style="border:0;border-radius:18px;box-shadow:0 26px 70px rgba(0,0,0,.18);padding:0;max-width:min(520px,calc(100vw - 32px));">
      <form method="dialog" style="margin:0;padding:16px 16px;background:rgba(255,255,255,.92);border:1px solid rgba(229,226,225,0.9);border-radius:18px;backdrop-filter: blur(12px);">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
          <div>
            <div style="font-weight:800;font-size:14px;color:var(--rw-text);" id="dlgTitle">Set price</div>
            <div class="muted" style="margin-top:4px;" id="dlgSub"></div>
          </div>
          <button class="secondary" value="cancel" type="submit" aria-label="Close" style="padding:8px 10px;border-radius:12px;">&times;</button>
        </div>
        <div style="margin-top:12px">
          <label class="muted">Price per article</label>
          <input id="dlgPrice" type="number" min="0" step="0.01" value="0" />
        </div>
        <div class="right" style="margin-top:14px">
          <button class="secondary" value="cancel" type="submit">Cancel</button>
          <button id="dlgOk" value="ok" type="submit">Save</button>
        </div>
        <div class="muted" id="dlgMsg" style="margin-top:10px"></div>
      </form>
    </dialog>

    <script>
      (async function () {
        const user = await APP.requireRole("manager");
        if (!user) return;
        await renderTopbar({
          role: user.role,
          links: [
            { href: "/manager/dashboard.html", label: "Dashboard" },
            { href: "/manager/projects.html", label: "Projects" },
            { href: "/manager/review.html", label: "Review" },
            { href: "/manager/payments.html", label: "Payments" }
          ]
        });

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        if (!id) {
          window.location.href = "/manager/dashboard.html";
          return;
        }

        const msg = (t) => (document.getElementById("msg").textContent = t || "");
        const monthSelect = document.getElementById("monthSelect");
        let project = null;
        let allWriters = [];
        let activeMonth = currentMonthKey();
        let availableMonths = [];

        function pad2(n) {
          return String(n).padStart(2, "0");
        }

        function currentMonthKey() {
          const d = new Date();
          return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
        }

        function shiftMonth(month, delta) {
          const [year, monthNum] = month.split("-").map(Number);
          const d = new Date(Date.UTC(year, monthNum - 1 + delta, 1));
          return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}`;
        }

        function monthLabel(month) {
          const [year, monthNum] = month.split("-").map(Number);
          return new Date(Date.UTC(year, monthNum - 1, 1)).toLocaleString(undefined, {
            month: "long",
            year: "numeric",
            timeZone: "UTC"
          });
        }

        async function loadProject() {
          const projects = await APP.apiFetch("/api/projects");
          project = (projects.projects || []).find((p) => p.id === id);
          if (!project) throw new Error("Project not found.");
          document.getElementById("projectHeading").textContent = project.title || "Project";
          document.getElementById("projectMeta").textContent = `${project.status || "active"} - ${project.created_at ? new Date(project.created_at).toLocaleString() : ""}`;
          document.getElementById("pTitle").value = project.title || "";
          document.getElementById("pDesc").value = project.description || "";
          document.getElementById("pAi").checked = !!project.ai_check_enabled;
          document.getElementById("pPlag").checked = !!project.plagiarism_check_enabled;
          document.title = `MANAGER - Project - ${project.title || ""}`;
        }

        async function refreshAssigned() {
          APP.ui.tableSkeleton("rows", { rows: 6, cols: 4 });
          const writers = await APP.apiFetch(`/api/projects/${encodeURIComponent(id)}/writers`);
          const assigned = writers.writers || [];
          window.__assignedWriters = new Map(assigned.map((w) => [w.writer_id, w]));
          document.getElementById("rows").innerHTML = assigned.length
            ? assigned
                .map(
                  (w) => `<tr>
              <td>${APP.escapeHtml(w.users?.full_name || "Writer")}<div class="muted">${APP.escapeHtml(w.users?.email || "")}</div></td>
              <td>&#8377;${APP.escapeHtml(w.price_per_article)}</td>
              <td class="muted">${APP.escapeHtml(new Date(w.assigned_at).toLocaleString())}</td>
              <td class="right">
                <button class="secondary" data-edit="${w.writer_id}">Edit</button>
                <button class="danger" data-remove="${w.writer_id}" style="margin-left:8px">Remove</button>
              </td>
            </tr>`
                )
                .join("")
            : "<tr><td colspan='4' class='muted'>No writers assigned.</td></tr>";

          for (const b of document.querySelectorAll("button[data-edit]")) {
            b.onclick = async () => {
              const writerId = b.getAttribute("data-edit");
              const row = window.__assignedWriters.get(writerId);
              await openPriceDialog({
                title: "Edit writer price",
                sub: `${row?.users?.full_name || "Writer"} - ${row?.users?.email || ""}`,
                price: Number(row?.price_per_article || 0),
                onSave: async (price) => {
                  await APP.apiFetch(`/api/projects/${encodeURIComponent(id)}/writers/${encodeURIComponent(writerId)}`, {
                    method: "PATCH",
                    body: JSON.stringify({ price_per_article: price })
                  });
                }
              });
              await refreshAssigned();
              renderWriterRows();
            };
          }

          for (const b of document.querySelectorAll("button[data-remove]")) {
            b.onclick = async () => {
              const writerId = b.getAttribute("data-remove");
              const row = window.__assignedWriters.get(writerId);
              const ok = confirm(`Remove ${row?.users?.full_name || "writer"} from this project?`);
              if (!ok) return;
              msg("");
              try {
                await APP.apiFetch(`/api/projects/${encodeURIComponent(id)}/writers/${encodeURIComponent(writerId)}`, { method: "DELETE" });
                await refreshAssigned();
                renderWriterRows();
                msg("Removed.");
              } catch (e) {
                msg(e.message || String(e));
              }
            };
          }
        }

        async function loadWriters(q) {
          const mini = document.getElementById("writerMiniLoad");
          if (mini) mini.classList.remove("hidden");
          const resp = await APP.apiFetch(`/api/users/writers${q ? `?q=${encodeURIComponent(q)}` : ""}`, { skipLoader: true });
          allWriters = resp.users || [];
          renderWriterRows();
          if (mini) mini.classList.add("hidden");
        }

        function renderWriterRows() {
          const assignedMap = window.__assignedWriters || new Map();
          document.getElementById("writerRows").innerHTML = allWriters.length
            ? allWriters
                .map(
                  (u) => `<tr>
              <td>${APP.escapeHtml(u.full_name || "")}<div class="muted">${APP.escapeHtml(u.email || "")}</div></td>
              <td class="right">
                ${
                  assignedMap.has(u.id)
                    ? "<span class='pill' style='padding:6px 10px; font-weight:750;'>Already added</span>"
                    : `<button class="secondary" data-assign="${u.id}">Assign</button>`
                }
              </td>
            </tr>`
                )
                .join("")
            : "<tr><td colspan='2' class='muted'>No writers found.</td></tr>";

          for (const b of document.querySelectorAll("button[data-assign]")) {
            b.onclick = async () => {
              msg("");
              try {
                const writerId = b.getAttribute("data-assign");
                const u = allWriters.find((x) => x.id === writerId);
                await openPriceDialog({
                  title: "Assign writer",
                  sub: `${u?.full_name || "Writer"} - ${u?.email || ""}`,
                  price: 0,
                  onSave: async (price) => {
                    await APP.apiFetch(`/api/projects/${encodeURIComponent(id)}/writers`, {
                      method: "POST",
                      body: JSON.stringify({ writer_id: writerId, price_per_article: price })
                    });
                  }
                });
                await refreshAssigned();
                renderWriterRows();
                msg("Assigned.");
              } catch (e) {
                msg(e.message || String(e));
              }
            };
          }
        }

        function syncMonthSelect() {
          const months = Array.from(new Set([activeMonth, ...availableMonths])).sort((a, b) => b.localeCompare(a));
          monthSelect.innerHTML = months.map((m) => `<option value="${m}">${APP.escapeHtml(monthLabel(m))}</option>`).join("");
          monthSelect.value = activeMonth;
          const earliest = availableMonths.length ? availableMonths[availableMonths.length - 1] : activeMonth;
          document.getElementById("prevMonth").disabled = availableMonths.length === 0 || activeMonth <= earliest;
          document.getElementById("nextMonth").disabled = activeMonth >= currentMonthKey();
          document.getElementById("monthHint").textContent = `${monthLabel(activeMonth)} - writer numbers reset each month`;
        }

        function renderStats(stats) {
          document.getElementById("nApproved").textContent = String(stats.approved || 0);
          document.getElementById("nRejected").textContent = String(stats.rejected || 0);
          document.getElementById("nRework").textContent = String(stats.rework || 0);
          document.getElementById("nSubmitted").textContent = String(stats.submitted || 0);
        }

        function renderArticles(articles) {
          document.getElementById("articleRows").innerHTML = articles.length
            ? articles
                .map((a, idx) => {
                  const writerName = a.writer?.full_name || "Writer";
                  const reviewed = a.reviewed_at ? new Date(a.reviewed_at).toLocaleString() : "-";
                  const reviewUrl = `/manager/review.html?id=${encodeURIComponent(a.id)}`;
                  return `<tr data-review-url="${reviewUrl}" tabindex="0" style="cursor:pointer;">
                <td><span class="pill" style="font-weight:800;">${idx + 1}</span></td>
                <td>
                  <a href="${reviewUrl}" style="display:block;color:inherit;text-decoration:none;font-weight:800;">${APP.escapeHtml(a.title || "")}</a>
                  <div class="muted">${APP.escapeHtml(a.unique_id || a.id)}</div>
                </td>
                <td>
                  <div style="font-weight:750">${APP.escapeHtml(writerName)} (${APP.escapeHtml(a.writer_month_number)})</div>
                  <div class="muted">${APP.escapeHtml(a.writer?.email || "")}</div>
                </td>
                <td>${APP.badgeForStatus(a.status)}</td>
                <td class="muted">${APP.escapeHtml(new Date(a.submitted_at || a.created_at).toLocaleString())}</td>
                <td class="muted">${APP.escapeHtml(reviewed)}</td>
              </tr>`;
                })
                .join("")
            : `<tr><td colspan="6" class="muted">No submitted articles for ${APP.escapeHtml(monthLabel(activeMonth))}.</td></tr>`;

          for (const row of document.querySelectorAll("tr[data-review-url]")) {
            row.onclick = (e) => {
              if (e.target.closest("a")) return;
              window.location.href = row.getAttribute("data-review-url");
            };
            row.onkeydown = (e) => {
              if (e.key === "Enter") window.location.href = row.getAttribute("data-review-url");
            };
          }
        }

        async function loadArticleMonth() {
          APP.ui.textSkeleton("nApproved", { kind: "num", width: "54%" });
          APP.ui.textSkeleton("nRejected", { kind: "num", width: "54%" });
          APP.ui.textSkeleton("nRework", { kind: "num", width: "54%" });
          APP.ui.textSkeleton("nSubmitted", { kind: "num", width: "54%" });
          APP.ui.tableSkeleton("articleRows", { rows: 6, cols: 6 });

          const out = await APP.apiFetch(`/api/articles/project/${encodeURIComponent(id)}/month?month=${encodeURIComponent(activeMonth)}`);
          availableMonths = out.available_months || [];
          renderStats(out.stats || {});
          syncMonthSelect();
          renderArticles(out.articles || []);
        }

        async function openPriceDialog({ title, sub, price, onSave }) {
          const dlg = document.getElementById("priceDlg");
          const t = document.getElementById("dlgTitle");
          const s = document.getElementById("dlgSub");
          const p = document.getElementById("dlgPrice");
          const m = document.getElementById("dlgMsg");
          const okBtn = document.getElementById("dlgOk");

          t.textContent = title || "Set price";
          s.textContent = sub || "";
          p.value = String(Number.isFinite(Number(price)) ? Number(price) : 0);
          m.textContent = "";

          return new Promise((resolve, reject) => {
            const onClose = async () => {
              dlg.removeEventListener("close", onClose);
              okBtn.onclick = null;
              if (dlg.returnValue !== "ok") return resolve(false);
              const v = Number(p.value);
              if (!Number.isFinite(v) || v < 0) {
                m.textContent = "Please enter a valid non-negative price.";
                dlg.showModal();
                dlg.addEventListener("close", onClose);
                return;
              }
              try {
                okBtn.disabled = true;
                await onSave(v);
                resolve(true);
              } catch (e) {
                reject(e);
              } finally {
                okBtn.disabled = false;
              }
            };
            dlg.addEventListener("close", onClose);
            dlg.showModal();
          });
        }

        let searchTimer = null;
        document.getElementById("writerSearch").addEventListener("input", () => {
          const q = String(document.getElementById("writerSearch").value || "").trim();
          if (searchTimer) clearTimeout(searchTimer);
          searchTimer = setTimeout(async () => {
            try {
              await loadWriters(q);
            } catch (e) {
              msg(e.message || String(e));
              const mini = document.getElementById("writerMiniLoad");
              if (mini) mini.classList.add("hidden");
            }
          }, 220);
        });

        document.getElementById("saveProject").onclick = async () => {
          msg("");
          try {
            const body = {
              title: document.getElementById("pTitle").value.trim(),
              description: document.getElementById("pDesc").value,
              ai_check_enabled: document.getElementById("pAi").checked,
              plagiarism_check_enabled: document.getElementById("pPlag").checked
            };
            await APP.apiFetch(`/api/projects/${encodeURIComponent(id)}`, {
              method: "PATCH",
              body: JSON.stringify(body)
            });
            await loadProject();
            msg("Saved.");
          } catch (e) {
            msg(e.message || String(e));
          }
        };

        document.getElementById("prevMonth").onclick = async () => {
          activeMonth = shiftMonth(activeMonth, -1);
          await loadArticleMonth();
        };
        document.getElementById("nextMonth").onclick = async () => {
          activeMonth = shiftMonth(activeMonth, 1);
          await loadArticleMonth();
        };
        monthSelect.onchange = async () => {
          activeMonth = monthSelect.value;
          await loadArticleMonth();
        };

        try {
          msg("");
          syncMonthSelect();
          await loadProject();
          await refreshAssigned();
          await loadWriters("");
          await loadArticleMonth();
        } catch (e) {
          msg(e.message || String(e));
        }
      })();
    </script>
  </body>
</html>
