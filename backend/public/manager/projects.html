<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write • Manager • Projects</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap wide">
      <main class="projects-page">
        <section class="projects-page-head">
          <div>
            <h1>Projects</h1>
            <p>Create new editorial rooms, choose review checks, and keep your active workspaces organized in one place.</p>
          </div>
        </section>

        <div class="projects-layout">
          <section class="card projects-create-card">
            <p class="projects-kicker">Create Project</p>
            <div class="projects-form">
              <div class="projects-field">
                <label for="title">Title</label>
                <input id="title" placeholder="e.g. Q4 Market Analysis" />
              </div>

              <div class="projects-field">
                <label for="desc">Description</label>
                <textarea id="desc" placeholder="Briefly describe the project scope..."></textarea>
              </div>

              <div class="projects-toggle-grid">
                <div class="projects-toggle-card">
                  <div class="projects-toggle-copy">
                    <strong>AI Check</strong>
                    <span>Run AI screening for submitted articles.</span>
                  </div>
                  <label class="projects-switch" aria-label="Toggle AI check">
                    <input type="checkbox" id="ai" />
                    <span class="projects-switch-slider"></span>
                  </label>
                </div>

                <div class="projects-toggle-card">
                  <div class="projects-toggle-copy">
                    <strong>Plagiarism</strong>
                    <span>Check originality before approval.</span>
                  </div>
                  <label class="projects-switch" aria-label="Toggle plagiarism check">
                    <input type="checkbox" id="plag" />
                    <span class="projects-switch-slider"></span>
                  </label>
                </div>
              </div>

              <div class="projects-field">
                <label for="managerSearch">Add Managers (Optional)</label>
                <div class="projects-search">
                  <span class="material-symbols-outlined" aria-hidden="true">search</span>
                  <input id="managerSearch" placeholder="Search manager name or email..." />
                </div>
                <div id="selectedManagers" class="projects-selected"></div>
                <div class="projects-manager-list">
                  <div id="managerRows" class="projects-manager-rows"></div>
                </div>
              </div>

              <button id="create" class="projects-create-btn" type="button">Create Project</button>
              <div class="muted projects-form-msg" id="msg"></div>
            </div>
          </section>

          <section class="card projects-list-card">
            <div class="projects-list-head">
              <div>
                <p class="projects-kicker" style="margin-bottom:8px">My Projects</p>
                <div class="projects-count"><span class="material-symbols-outlined" aria-hidden="true">folder_copy</span><span id="projectCount">0 workspaces</span></div>
              </div>
            </div>
            <div id="rows" class="projects-list"></div>
          </section>
        </div>
      </main>
    </div>
    <script>
      (async function () {
        const user = await APP.requireRole("manager");
        if (!user) return;
        await renderTopbar({ role: user.role, links: [{ href: "/manager/dashboard.html", label: "Dashboard" }] });

        const msg = (t) => (document.getElementById("msg").textContent = t || "");
        let allManagers = [];
        const selectedManagerIds = new Set();
        const managerRows = document.getElementById("managerRows");
        const projectRows = document.getElementById("rows");

        function formatDate(value) {
          if (!value) return "Recently created";
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return "Recently created";
          return date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
        }

        function statusLabel(status) {
          const text = String(status || "active").replace(/_/g, " ").trim();
          return text ? text[0].toUpperCase() + text.slice(1) : "Active";
        }

        function renderProjectSkeleton() {
          projectRows.innerHTML = Array.from({ length: 3 })
            .map(
              () => `<article class="project-row-card is-skeleton">
                <span class="rw-skeleton project-row-skeleton-title"></span>
                <span class="rw-skeleton project-row-skeleton-line"></span>
                <span class="rw-skeleton project-row-skeleton-line" style="width:84%"></span>
              </article>`
            )
            .join("");
        }

        function renderSelectedManagers() {
          const selected = allManagers.filter((m) => selectedManagerIds.has(m.id));
          document.getElementById("selectedManagers").innerHTML = selected.length
            ? selected
                .map((m) => `<span class="projects-chip">${APP.escapeHtml(m.full_name || m.email || "Manager")}</span>`)
                .join("")
            : `<span class="projects-selected-empty">No extra managers selected.</span>`;
        }

        function renderManagerRows() {
          const visibleManagers = allManagers.filter((m) => m.id !== user.id);
          managerRows.innerHTML = visibleManagers.length
            ? visibleManagers
                .map((m) => {
                  const isSelected = selectedManagerIds.has(m.id);
                  return `<article class="projects-manager-row">
                    <div>
                      <div class="projects-manager-name">${APP.escapeHtml(m.full_name || "Manager")}</div>
                      <div class="projects-manager-email">${APP.escapeHtml(m.email || "")}</div>
                    </div>
                    <button class="secondary projects-add-btn ${isSelected ? "is-selected" : ""}" data-manager="${m.id}" type="button">
                      ${isSelected ? "Remove" : "Add"}
                    </button>
                  </article>`;
                })
                .join("")
            : `<article class="project-row-card is-empty"><div class="project-row-empty">No managers found for that search.</div></article>`;

          for (const b of document.querySelectorAll("button[data-manager]")) {
            b.onclick = () => {
              const managerId = b.getAttribute("data-manager");
              if (selectedManagerIds.has(managerId)) selectedManagerIds.delete(managerId);
              else selectedManagerIds.add(managerId);
              renderSelectedManagers();
              renderManagerRows();
            };
          }
          renderSelectedManagers();
        }

        async function loadManagers(q) {
          const resp = await APP.apiFetch(`/api/users/managers${q ? `?q=${encodeURIComponent(q)}` : ""}`, { skipLoader: true });
          allManagers = resp.users || [];
          renderManagerRows();
        }

        async function refresh() {
          renderProjectSkeleton();
          const projects = await APP.apiFetch("/api/projects");
          const rows = projects.projects || [];
          document.getElementById("projectCount").textContent = `${rows.length} workspace${rows.length === 1 ? "" : "s"}`;
          projectRows.innerHTML = rows.length
            ? rows
                .map((p) => {
                  const description = String(p.description || "").trim() || "No description added yet for this project.";
                  return `<article class="project-row-card">
                    <div class="project-row-card-head">
                      <div>
                        <h3 class="project-row-title">${APP.escapeHtml(p.title || "Untitled project")}</h3>
                      </div>
                      <span class="project-row-status" data-status="${APP.escapeHtml(String(p.status || "active").toLowerCase())}">${APP.escapeHtml(
                        statusLabel(p.status)
                      )}</span>
                    </div>
                    <p class="project-row-summary">${APP.escapeHtml(description)}</p>
                    <div class="project-row-meta">
                      <span><span class="material-symbols-outlined" aria-hidden="true">event</span>${APP.escapeHtml(formatDate(p.created_at))}</span>
                      <span><span class="material-symbols-outlined" aria-hidden="true">person</span>Manager workspace</span>
                    </div>
                    <div class="project-row-checks">
                      <span><span class="material-symbols-outlined" aria-hidden="true">${p.ai_check_enabled ? "check_circle" : "radio_button_unchecked"}</span>AI check ${
                        p.ai_check_enabled ? "on" : "off"
                      }</span>
                      <span><span class="material-symbols-outlined" aria-hidden="true">${
                        p.plagiarism_check_enabled ? "check_circle" : "radio_button_unchecked"
                      }</span>Plagiarism ${p.plagiarism_check_enabled ? "on" : "off"}</span>
                    </div>
                    <div class="project-row-actions">
                      <a href="/manager/project-detail.html?id=${encodeURIComponent(p.id)}"><button class="secondary project-row-open" type="button">Open</button></a>
                      <button class="project-row-delete" data-delete="${p.id}" data-title="${APP.escapeHtml(p.title || "this project")}" type="button">Delete</button>
                    </div>
                  </article>`;
                })
                .join("")
            : `<article class="project-row-card is-empty"><div class="project-row-empty">No projects yet. Create your first workspace from the form on the left.</div></article>`;
          for (const b of document.querySelectorAll("button[data-delete]")) {
            b.onclick = async () => {
              msg("");
              const title = b.getAttribute("data-title") || "this project";
              const ok = confirm(`Delete ${title}? This will remove its writer assignments, articles, and payments.`);
              if (!ok) return;
              try {
                await APP.apiFetch(`/api/projects/${encodeURIComponent(b.getAttribute("data-delete"))}`, { method: "DELETE" });
                await refresh();
                msg("Deleted.");
              } catch (e) {
                msg(e.message || String(e));
              }
            };
          }
        }
        await refresh();

        document.getElementById("create").onclick = async () => {
          msg("");
          try {
            const body = {
              title: document.getElementById("title").value.trim(),
              description: document.getElementById("desc").value,
              ai_check_enabled: document.getElementById("ai").checked,
              plagiarism_check_enabled: document.getElementById("plag").checked,
              manager_ids: Array.from(selectedManagerIds)
            };
            await APP.ui.runActionOverlay({
              title: "Creating project...",
              sub: "Saving the new workspace",
              successSymbol: "done_all",
              errorSymbol: "error",
              action: async () => APP.apiFetch("/api/projects", { method: "POST", body: JSON.stringify(body) })
            });
            document.getElementById("title").value = "";
            document.getElementById("desc").value = "";
            document.getElementById("ai").checked = false;
            document.getElementById("plag").checked = false;
            document.getElementById("managerSearch").value = "";
            selectedManagerIds.clear();
            renderSelectedManagers();
            await loadManagers("");
            await refresh();
            msg("Created.");
          } catch (e) {
            msg(e.message || String(e));
          }
        };

        let managerSearchTimer = null;
        document.getElementById("managerSearch").addEventListener("input", () => {
          const q = String(document.getElementById("managerSearch").value || "").trim();
          if (managerSearchTimer) clearTimeout(managerSearchTimer);
          managerSearchTimer = setTimeout(() => loadManagers(q).catch((e) => msg(e.message || String(e))), 220);
        });
        await loadManagers("");
      })();
    </script>
  </body>
</html>
