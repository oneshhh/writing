<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write • Manager • Projects</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap">
      <div class="grid">
        <div class="card" style="grid-column: span 6">
          <h2>Create Project</h2>
          <div>
            <label class="muted">Title</label>
            <input id="title" />
          </div>
          <div style="margin-top: 10px">
            <label class="muted">Description</label>
            <textarea id="desc"></textarea>
          </div>
          <div class="two" style="margin-top: 10px">
            <label class="pill"><input type="checkbox" id="ai" /> AI check enabled</label>
            <label class="pill"><input type="checkbox" id="plag" /> Plagiarism check enabled</label>
          </div>
          <div style="margin-top: 14px">
            <label class="muted">Add managers now (optional)</label>
            <input id="managerSearch" placeholder="search manager name or email..." />
            <div class="muted" id="selectedManagers" style="margin-top:8px"></div>
            <div
              style="margin-top: 10px; max-height: 220px; overflow: auto; border: 1px solid rgba(229,226,225,0.95); border-radius: 16px; background: rgba(255,255,255,.65)"
            >
              <table style="margin: 0">
                <thead><tr><th>Manager</th><th></th></tr></thead>
                <tbody id="managerRows"></tbody>
              </table>
            </div>
          </div>
          <div class="right" style="margin-top: 12px">
            <button id="create">Create</button>
          </div>
          <div class="muted" id="msg" style="margin-top: 10px"></div>
        </div>
        <div class="card" style="grid-column: span 6">
          <h2>My Projects</h2>
          <table>
            <thead><tr><th>Title</th><th>Status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script>
      (async function () {
        const user = await APP.requireRole("manager");
        if (!user) return;
        await renderTopbar({ role: user.role, links: [{ href: "/manager/dashboard.html", label: "Dashboard" }] });

        const msg = (t) => (document.getElementById("msg").textContent = t || "");
        let allManagers = [];
        const selectedManagerIds = new Set();

        function renderSelectedManagers() {
          const selected = allManagers.filter((m) => selectedManagerIds.has(m.id));
          document.getElementById("selectedManagers").textContent = selected.length
            ? `Selected: ${selected.map((m) => m.full_name || m.email).join(", ")}`
            : "No extra managers selected.";
        }

        function renderManagerRows() {
          document.getElementById("managerRows").innerHTML = allManagers.length
            ? allManagers
                .filter((m) => m.id !== user.id)
                .map(
                  (m) => `<tr>
                    <td>${APP.escapeHtml(m.full_name || "Manager")}<div class="muted">${APP.escapeHtml(m.email || "")}</div></td>
                    <td class="right">
                      <button class="secondary" data-manager="${m.id}">
                        ${selectedManagerIds.has(m.id) ? "Remove" : "Add"}
                      </button>
                    </td>
                  </tr>`
                )
                .join("")
            : "<tr><td colspan='2' class='muted'>No managers found.</td></tr>";

          for (const b of document.querySelectorAll("button[data-manager]")) {
            b.onclick = () => {
              const managerId = b.getAttribute("data-manager");
              if (selectedManagerIds.has(managerId)) selectedManagerIds.delete(managerId);
              else selectedManagerIds.add(managerId);
              renderSelectedManagers();
              renderManagerRows();
            };
          }
          renderSelectedManagers();
        }

        async function loadManagers(q) {
          const resp = await APP.apiFetch(`/api/users/managers${q ? `?q=${encodeURIComponent(q)}` : ""}`, { skipLoader: true });
          allManagers = resp.users || [];
          renderManagerRows();
        }

        async function refresh() {
          APP.ui.tableSkeleton("rows", { rows: 8, cols: 3 });
          const projects = await APP.apiFetch("/api/projects");
          document.getElementById("rows").innerHTML = (projects.projects || [])
            .map((p) => `<tr>
              <td>${APP.escapeHtml(p.title)}</td>
              <td class="muted">${APP.escapeHtml(p.status)}</td>
              <td class="right">
                <a href="/manager/project-detail.html?id=${encodeURIComponent(p.id)}"><button class="secondary">Open</button></a>
                <button class="danger" data-delete="${p.id}" data-title="${APP.escapeHtml(p.title)}">Delete</button>
              </td>
            </tr>`)
            .join("");
          for (const b of document.querySelectorAll("button[data-delete]")) {
            b.onclick = async () => {
              msg("");
              const title = b.getAttribute("data-title") || "this project";
              const ok = confirm(`Delete ${title}? This will remove its writer assignments, articles, and payments.`);
              if (!ok) return;
              try {
                await APP.apiFetch(`/api/projects/${encodeURIComponent(b.getAttribute("data-delete"))}`, { method: "DELETE" });
                await refresh();
                msg("Deleted.");
              } catch (e) {
                msg(e.message || String(e));
              }
            };
          }
        }
        await refresh();

        document.getElementById("create").onclick = async () => {
          msg("");
          try {
            const body = {
              title: document.getElementById("title").value.trim(),
              description: document.getElementById("desc").value,
              ai_check_enabled: document.getElementById("ai").checked,
              plagiarism_check_enabled: document.getElementById("plag").checked,
              manager_ids: Array.from(selectedManagerIds)
            };
            await APP.apiFetch("/api/projects", { method: "POST", body: JSON.stringify(body) });
            document.getElementById("title").value = "";
            document.getElementById("desc").value = "";
            document.getElementById("ai").checked = false;
            document.getElementById("plag").checked = false;
            selectedManagerIds.clear();
            renderSelectedManagers();
            await refresh();
            msg("Created.");
          } catch (e) {
            msg(e.message || String(e));
          }
        };

        let managerSearchTimer = null;
        document.getElementById("managerSearch").addEventListener("input", () => {
          const q = String(document.getElementById("managerSearch").value || "").trim();
          if (managerSearchTimer) clearTimeout(managerSearchTimer);
          managerSearchTimer = setTimeout(() => loadManagers(q).catch((e) => msg(e.message || String(e))), 220);
        });
        await loadManagers("");
      })();
    </script>
  </body>
</html>
