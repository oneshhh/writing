<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write - Manager Messages</title>
    <link rel="stylesheet" href="/assets/styles.css?v=messages-ui-20260708-2" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap wide">
      <div class="chat-shell">
        <aside class="card chat-panel">
          <div class="chat-panel-head">
            <span class="material-symbols-outlined" aria-hidden="true">forum</span>
            <div>
              <h2>Messages</h2>
              <p>People in your organisation</p>
            </div>
          </div>
          <input id="chatSearch" placeholder="Search people or project rooms..." />
          <div class="chat-list" id="conversationList" style="margin-top:12px"></div>
        </aside>
        <main class="card chat-thread">
          <div class="chat-thread-head">
            <div class="chat-thread-identity">
              <span class="chat-avatar room" id="chatHeaderAvatar">#</span>
              <div>
                <h3 id="chatTitle">Choose a conversation</h3>
                <div class="muted" id="chatSubtitle">Select a person from the left to open a private room.</div>
              </div>
            </div>
            <div class="chat-thread-actions">
              <button class="chat-tool coming-soon" type="button" data-coming-soon="Video calls are coming soon" title="Coming soon">
                <span class="material-symbols-outlined" aria-hidden="true">videocam</span>
              </button>
              <button class="chat-tool coming-soon" type="button" data-coming-soon="Voice calls are coming soon" title="Coming soon">
                <span class="material-symbols-outlined" aria-hidden="true">call</span>
              </button>
              <button class="chat-tool coming-soon" type="button" data-coming-soon="More chat actions are coming soon" title="Coming soon">
                <span class="material-symbols-outlined" aria-hidden="true">more_vert</span>
              </button>
            </div>
          </div>
          <div class="chat-messages" id="messageList"></div>
          <div class="chat-composer hidden" id="chatComposer">
            <div class="chat-compose-box">
              <textarea id="messageText" placeholder="Type a message..." rows="1"></textarea>
              <div class="chat-compose-tools">
                <div class="chat-tool-group">
                  <button class="chat-tool coming-soon" type="button" data-coming-soon="File attachments are coming soon" title="Coming soon">
                    <span class="material-symbols-outlined" aria-hidden="true">attach_file</span>
                  </button>
                  <button class="chat-tool coming-soon" type="button" data-coming-soon="Emoji reactions are coming soon" title="Coming soon">
                    <span class="material-symbols-outlined" aria-hidden="true">sentiment_satisfied</span>
                  </button>
                  <button class="chat-tool coming-soon" type="button" data-coming-soon="Rich text formatting is coming soon" title="Coming soon">
                    <span class="material-symbols-outlined" aria-hidden="true">format_bold</span>
                  </button>
                  <span class="chat-tool-divider"></span>
                  <button class="chat-tool coming-soon" type="button" data-coming-soon="Voice notes are coming soon" title="Coming soon">
                    <span class="material-symbols-outlined" aria-hidden="true">mic</span>
                  </button>
                </div>
                <button id="sendMessage" type="button" aria-label="Send message">
                  <span class="material-symbols-outlined" aria-hidden="true">send</span>
                </button>
              </div>
            </div>
            <span class="muted" id="msg">Press Enter to send. Shift+Enter for a new line.</span>
          </div>
        </main>
      </div>
    </div>
    <script>window.RW_MESSAGES_ROLE = "manager";</script>
    <script src="/shared/messages.js?v=messages-ui-20260708-2"></script>
  </body>
</html>
