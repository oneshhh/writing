<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write - Manager Calendar</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap wide">
      <div class="grid">
        <div class="card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div>
              <h3 style="margin:0">Project Planner</h3>
              <div class="muted" id="rangeLabel" style="margin-top:6px">30-day project calendar</div>
            </div>
            <div class="right">
              <select id="projectFilter" style="width:auto;min-width:220px"></select>
              <button class="secondary" id="prevRange" type="button">Previous 30 days</button>
              <button class="secondary" id="todayRange" type="button">Today</button>
              <button class="secondary" id="nextRange" type="button">Next 30 days</button>
            </div>
          </div>
        </div>
        <div class="card">
          <div id="plannerGrid" class="planner-grid"></div>
        </div>
      </div>
    </div>

    <script>
      (async function () {
        const user = await APP.requireRole("manager");
        if (!user) return;
        await renderTopbar({ role: user.role, links: [{ href: "/manager/dashboard.html", label: "Dashboard" }, { href: "/manager/projects.html", label: "Projects" }, { href: "/manager/review.html", label: "Review" }, { href: "/manager/payments.html", label: "Payments" }] });

        let start = new Date();
        start.setHours(0, 0, 0, 0);
        const projectFilter = document.getElementById("projectFilter");

        function key(d) {
          return d.toISOString().slice(0, 10);
        }

        async function loadProjects() {
          const out = await APP.apiFetch("/api/projects");
          projectFilter.innerHTML = `<option value="">All projects</option>${(out.projects || [])
            .map((p) => `<option value="${p.id}">${APP.escapeHtml(p.title || "Project")}</option>`)
            .join("")}`;
        }

        function render(days) {
          const map = new Map((days || []).map((day) => [day.date, day]));
          const cells = [];
          for (let i = 0; i < 30; i += 1) {
            const d = new Date(start);
            d.setDate(start.getDate() + i);
            const dateKey = key(d);
            const row = map.get(dateKey) || { date: dateKey, approved: 0, requests_due: 0, notes: [] };
            cells.push(`<div class="planner-day">
              <span class="planner-date">${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span>
              <strong>${d.toLocaleDateString(undefined, { weekday: "short" })}</strong>
              <span class="planner-metrics">
                <span>${row.approved || 0} approved</span>
                <span>${row.requests_due || 0} requests due</span>
              </span>
              ${(row.notes || []).map((n) => `<span class="planner-note">${APP.escapeHtml(n.title)}</span>`).join("")}
            </div>`);
          }
          document.getElementById("plannerGrid").innerHTML = cells.join("");
          document.getElementById("rangeLabel").textContent = `${key(start)} to ${key(new Date(start.getTime() + 29 * 86400000))}`;
        }

        async function load() {
          const project = projectFilter.value ? `&project_id=${encodeURIComponent(projectFilter.value)}` : "";
          const out = await APP.apiFetch(`/api/calendar?start=${encodeURIComponent(key(start))}&days=30${project}`);
          render(out.days || []);
        }

        document.getElementById("prevRange").onclick = async () => {
          start.setDate(start.getDate() - 30);
          await load();
        };
        document.getElementById("nextRange").onclick = async () => {
          start.setDate(start.getDate() + 30);
          await load();
        };
        document.getElementById("todayRange").onclick = async () => {
          start = new Date();
          start.setHours(0, 0, 0, 0);
          await load();
        };
        projectFilter.onchange = load;
        await loadProjects();
        await load();
      })();
    </script>
  </body>
</html>
