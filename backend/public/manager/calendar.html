<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write - Manager Calendar</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap wide">
      <main class="calendar-page">
        <section class="calendar-hero">
          <div>
            <h1>Editorial Calendar</h1>
            <p>Manage project approvals and request deadlines for the selected month.</p>
          </div>
          <div class="calendar-controls">
            <select class="calendar-select" id="projectFilter"></select>
            <div class="calendar-month-nav" aria-label="Calendar month navigation">
              <button id="prevMonth" type="button" aria-label="Previous month">
                <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
              </button>
              <strong id="monthLabel"></strong>
              <button id="nextMonth" type="button" aria-label="Next month">
                <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
              </button>
            </div>
            <button class="secondary" id="todayRange" type="button">Today</button>
          </div>
        </section>

        <section class="calendar-legend" aria-label="Calendar legend">
          <span class="calendar-legend-item"><span class="planner-count">03</span> Articles approved</span>
          <span class="calendar-legend-item"><span class="planner-due">02</span> Requests due</span>
          <span class="calendar-legend-item"><span class="material-symbols-outlined" aria-hidden="true">edit_note</span> Manager note</span>
        </section>

        <section class="calendar-shell">
          <div class="calendar-weekdays" aria-hidden="true">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div id="plannerGrid" class="planner-grid"></div>
        </section>
      </main>
    </div>

    <script>
      (async function () {
        const user = await APP.requireRole("manager");
        if (!user) return;
        await renderTopbar({ role: user.role, links: [] });

        let cursor = new Date();
        cursor = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
        const projectFilter = document.getElementById("projectFilter");
        const calendarShell = document.querySelector(".calendar-shell");

        function key(d) {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          return `${y}-${m}-${day}`;
        }

        function monthStart() {
          return new Date(cursor.getFullYear(), cursor.getMonth(), 1);
        }

        function monthDays() {
          return new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
        }

        function mondayOffset(d) {
          return (d.getDay() + 6) % 7;
        }

        function monthLabel() {
          return cursor.toLocaleDateString(undefined, { month: "long", year: "numeric" });
        }

        function eventTypeLabel(event) {
          if (event?.type === "article_approved") return "Article approved";
          if (event?.type === "request_due") return `${String(event.status || "open").replace(/_/g, " ")} request`;
          if (event?.type === "note") return "Manager note";
          return "Calendar event";
        }

        function renderTooltip(events) {
          if (!events?.length) return "";
          return `<div class="planner-tooltip" role="tooltip">
            ${events
              .map(
                (event, index) => `<div class="planner-tooltip-item">
                  <span class="planner-tooltip-type">${APP.escapeHtml(`${eventTypeLabel(event)} ${index + 1}`)}</span>
                  <span class="planner-tooltip-text">${APP.escapeHtml(event.title || event.note || "Untitled event")}</span>
                </div>`
              )
              .join("")}
          </div>`;
        }

        function measureTooltip(tooltip) {
          const display = tooltip.style.display;
          const visibility = tooltip.style.visibility;
          tooltip.style.display = "grid";
          tooltip.style.visibility = "hidden";
          const rect = tooltip.getBoundingClientRect();
          tooltip.style.display = display;
          tooltip.style.visibility = visibility;
          return rect;
        }

        function applyTooltipPlacement() {
          if (!calendarShell) return;
          const shellRect = calendarShell.getBoundingClientRect();
          const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
          for (const day of document.querySelectorAll(".planner-day")) {
            const tooltip = day.querySelector(".planner-tooltip");
            if (!tooltip) continue;

            const tooltipRect = measureTooltip(tooltip);
            const dayRect = day.getBoundingClientRect();
            const topSpace = dayRect.top - shellRect.top;
            const bottomSpace = Math.min(shellRect.bottom, viewportHeight) - dayRect.bottom;
            const needsBottomPlacement = topSpace < tooltipRect.height + 18 && bottomSpace > topSpace;
            day.dataset.tooltipPlacement = needsBottomPlacement ? "bottom" : "top";
          }
        }

        async function loadProjects() {
          const out = await APP.apiFetch("/api/projects");
          projectFilter.innerHTML = `<option value="">All projects</option>${(out.projects || [])
            .map((p) => `<option value="${p.id}">${APP.escapeHtml(p.title || "Project")}</option>`)
            .join("")}`;
        }

        function dayCell(d, row, outside) {
          const today = key(d) === key(new Date());
          const approved = Number(row.approved || 0);
          const due = Number(row.requests_due || 0);
          const tooltip = renderTooltip(row.events || []);
          return `<div class="planner-day ${outside ? "is-outside" : ""} ${today ? "is-today" : ""}">
            <div class="planner-date-row">
              <span class="planner-date">${d.getDate()}</span>
              <span class="planner-metrics">
                ${approved ? `<span class="planner-count">${approved}</span>` : ""}
                ${due ? `<span class="planner-due">${due}</span>` : ""}
              </span>
            </div>
            <div>
              ${(row.notes || [])
                .slice(0, 2)
                .map((n) => `<span class="planner-note"><span class="material-symbols-outlined" aria-hidden="true">edit_note</span>${APP.escapeHtml(n.title)}</span>`)
                .join("")}
            </div>
            ${tooltip}
          </div>`;
        }

        function render(days) {
          const map = new Map((days || []).map((day) => [day.date, day]));
          const first = monthStart();
          const leading = mondayOffset(first);
          const totalDays = monthDays();
          const totalCells = Math.ceil((leading + totalDays) / 7) * 7;
          const gridStart = new Date(first);
          gridStart.setDate(first.getDate() - leading);
          const cells = [];

          for (let i = 0; i < totalCells; i += 1) {
            const d = new Date(gridStart);
            d.setDate(gridStart.getDate() + i);
            const dateKey = key(d);
            const outside = d.getMonth() !== cursor.getMonth();
            const row = map.get(dateKey) || { date: dateKey, approved: 0, requests_due: 0, notes: [] };
            cells.push(dayCell(d, row, outside));
          }

          document.getElementById("plannerGrid").innerHTML = cells.join("");
          document.getElementById("monthLabel").textContent = monthLabel();
          applyTooltipPlacement();
        }

        async function load() {
          const project = projectFilter.value ? `&project_id=${encodeURIComponent(projectFilter.value)}` : "";
          const out = await APP.apiFetch(`/api/calendar?start=${encodeURIComponent(key(monthStart()))}&days=${monthDays()}${project}`);
          render(out.days || []);
        }

        document.getElementById("prevMonth").onclick = async () => {
          cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1);
          await load();
        };
        document.getElementById("nextMonth").onclick = async () => {
          cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
          await load();
        };
        document.getElementById("todayRange").onclick = async () => {
          const today = new Date();
          cursor = new Date(today.getFullYear(), today.getMonth(), 1);
          await load();
        };
        projectFilter.onchange = load;
        window.addEventListener("resize", applyTooltipPlacement);
        await loadProjects();
        await load();
      })();
    </script>
  </body>
</html>
