<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Real Write • Admin • Projects</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap wide">
      <div class="grid">
        <div class="card">
          <h2>All Projects</h2>
          <table>
            <thead><tr><th>Title</th><th>Status</th><th>Created by</th><th>Created</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script>
      (async function () {
        const user = await APP.requireRole("admin");
        if (!user) return;
        await renderTopbar({
          role: user.role,
          links: [
            { href: "/admin/dashboard.html", label: "Dashboard" },
            { href: "/admin/users.html", label: "Users" },
            { href: "/admin/projects.html", label: "Projects" },
            { href: "/admin/payments.html", label: "Payments" }
          ]
        });

        APP.ui.tableSkeleton("rows", { rows: 8, cols: 5 });
        const projects = await APP.apiFetch("/api/projects");
        document.getElementById("rows").innerHTML = (projects.projects || [])
          .map((p) => `<tr>
            <td>${APP.escapeHtml(p.title)}</td>
            <td class="muted">${APP.escapeHtml(p.status)}</td>
            <td class="muted">${APP.escapeHtml(p.created_by)}</td>
            <td class="muted">${APP.escapeHtml(new Date(p.created_at).toLocaleString())}</td>
            <td class="right"><a href="/admin/project-detail.html?id=${encodeURIComponent(p.id)}"><button class="secondary" type="button">Open</button></a></td>
          </tr>`)
          .join("");
      })();
    </script>
  </body>
</html>
