<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write • Writer • New Article</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap">
      <div class="grid">
        <div class="card" style="grid-column: span 7">
          <h2>Create Article</h2>
          <div class="muted hidden" id="requestMeta" style="margin-top:8px"></div>
          <div class="two">
            <div>
              <label class="muted">Project</label>
              <select id="project"></select>
            </div>
            <div>
              <label class="muted">Type</label>
              <select id="type">
                <option value="news">news</option>
                <option value="blog">blog</option>
                <option value="review">review</option>
                <option value="opinion">opinion</option>
                <option value="tutorial">tutorial</option>
                <option value="interview">interview</option>
                <option value="other">other</option>
              </select>
            </div>
          </div>
          <div style="margin-top: 10px">
            <label class="muted">Title</label>
            <input id="title" placeholder="Article title" />
          </div>
          <div style="margin-top: 10px">
            <label class="muted">Short description</label>
            <textarea id="short" placeholder="1–3 lines summary"></textarea>
          </div>
          <div class="right" style="margin-top: 12px">
            <a href="/writer/dashboard.html"><button class="secondary">Cancel</button></a>
            <button id="create">Create</button>
          </div>
          <div class="muted" id="msg" style="margin-top: 10px"></div>
        </div>
        <div class="card" style="grid-column: span 5">
          <h2>Next</h2>
          <div class="muted">After creation you’ll land in the editor (Quill) to write and submit.</div>
        </div>
      </div>
    </div>
    <script>
      (async function () {
        const user = await APP.requireRole("writer");
        if (!user) return;
        await renderTopbar({ role: user.role, links: [{ href: "/writer/dashboard.html", label: "Dashboard" }] });

        const params = new URLSearchParams(window.location.search);
        const requestedRequestId = params.get("request");
        let requestContext = null;

        const projects = await APP.apiFetch("/api/projects");
        document.getElementById("project").innerHTML = (projects.projects || [])
          .map((p) => `<option value="${p.id}">${APP.escapeHtml(p.title)}</option>`)
          .join("");

        const msg = (t) => (document.getElementById("msg").textContent = t || "");
        if (requestedRequestId) {
          const requestOut = await APP.apiFetch("/api/requests");
          requestContext = (requestOut.requests || []).find((request) => request.id === requestedRequestId) || null;
          if (!requestContext) {
            msg("That request is no longer available.");
            return;
          }
          if (requestContext.linked_article?.id) {
            window.location.href = `/writer/editor.html?id=${encodeURIComponent(requestContext.linked_article.id)}`;
            return;
          }
          if (requestContext.recipient_status !== "accepted") {
            msg("Accept the request before creating an article for it.");
            return;
          }
          document.getElementById("project").value = requestContext.project_id;
          document.getElementById("project").disabled = true;
          document.getElementById("title").value = requestContext.title || "";
          document.getElementById("short").value = requestContext.brief || "";
          document.getElementById("requestMeta").textContent = `This article is being created for request: ${requestContext.title || "Writing request"}`;
          document.getElementById("requestMeta").classList.remove("hidden");
        }
        document.getElementById("create").onclick = async () => {
          msg("");
          try {
            const body = {
              project_id: document.getElementById("project").value,
              request_id: requestContext?.id || null,
              article_type: document.getElementById("type").value,
              title: document.getElementById("title").value.trim(),
              short_description: document.getElementById("short").value
            };
            const created = await APP.apiFetch("/api/articles", { method: "POST", body: JSON.stringify(body) });
            window.location.href = `/writer/editor.html?id=${encodeURIComponent(created.article.id)}`;
          } catch (e) {
            msg(e.message || String(e));
          }
        };
      })();
    </script>
  </body>
</html>
