<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write • Writer Dashboard</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap wide">
      <div class="grid">
        <div class="card">
          <h3 id="welcome" style="margin:0"></h3>
          <div class="muted" style="margin-top:6px">Pick an article to edit in <code>draft</code> or <code>rework</code>, or check remarks on rejected items.</div>
        </div>
        <div class="card">
          <h2>My Article Status</h2>
          <div class="row">
            <div class="stat">
              <div class="pill dot green">Approved</div>
              <div class="n" id="nApproved">0</div>
            </div>
            <div class="stat">
              <div class="pill dot red">Rejected</div>
              <div class="n" id="nRejected">0</div>
            </div>
            <div class="stat">
              <div class="pill dot amber">Rework</div>
              <div class="n" id="nRework">0</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="right">
            <a href="/writer/submit.html"><button>New article</button></a>
          </div>
          <h2>My Articles</h2>
          <table class="mobile-stack-table writer-articles-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Project</th>
                <th>Status</th>
                <th>AI</th>
                <th>Plagiarism</th>
                <th>Updated</th>
                <th>Remark</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="right" style="margin-top: 12px">
            <button class="secondary" id="prev">Previous</button>
            <span class="muted" id="pageInfo"></span>
            <button class="secondary" id="next">Next</button>
          </div>
        </div>

        <div class="card">
          <h2>Writing Requests</h2>
          <table class="mobile-stack-table">
            <thead><tr><th>Request</th><th>Due</th><th>Extra pay</th><th>Status</th><th></th></tr></thead>
            <tbody id="requestRows"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      (async function () {
        const user = await APP.requireRole("writer");
        if (!user) return;
        await renderTopbar({
          role: user.role,
          links: [{ href: "/writer/dashboard.html", label: "Dashboard" }, { href: "/writer/earnings.html", label: "Earnings" }]
        });

        document.getElementById("welcome").textContent = `Welcome, ${user.full_name || "Writer"}`;

        APP.ui.textSkeleton("nApproved", { kind: "num", width: "54%" });
        APP.ui.textSkeleton("nRejected", { kind: "num", width: "54%" });
        APP.ui.textSkeleton("nRework", { kind: "num", width: "54%" });
        APP.ui.tableSkeleton("rows", { rows: 8, cols: 8 });
        APP.ui.textSkeleton("pageInfo", { kind: "line", width: "120px" });

        const pageSize = 20;
        let offset = 0;
        let total = null;
        let projectName = new Map();
        const requestedArticleId = new URLSearchParams(window.location.search).get("article");
        const requestedRequestId = new URLSearchParams(window.location.search).get("request");

        function focusRequestedArticle() {
          if (!requestedArticleId) return;
          const row = document.querySelector(`[data-article-row="${requestedArticleId}"]`);
          if (!row) return;
          row.style.outline = "2px solid rgba(196,90,43,0.45)";
          row.style.outlineOffset = "-2px";
          row.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        function focusRequestedRequest() {
          if (!requestedRequestId) return;
          const row = document.querySelector(`[data-request-row="${requestedRequestId}"]`);
          if (!row) return;
          row.style.outline = "2px solid rgba(196,90,43,0.45)";
          row.style.outlineOffset = "-2px";
          row.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        function renderRows(rows) {
          document.getElementById("rows").innerHTML = (rows || [])
            .map((a) => {
              const canEdit = a.status === "draft" || a.status === "rework";
              return `
                <tr data-article-row="${a.id}">
                  <td data-label="Title">${APP.escapeHtml(a.title)}</td>
                  <td class="muted" data-label="Project">${APP.escapeHtml(projectName.get(a.project_id) || a.project_id)}</td>
                  <td data-label="Status">${APP.badgeForStatus(a.status)}</td>
                  <td data-label="AI">${APP.checkBadge(a.ai_score)}</td>
                  <td data-label="Plagiarism">${APP.checkBadge(a.plagiarism_score)}</td>
                  <td class="muted" data-label="Updated">${APP.escapeHtml(new Date(a.updated_at || a.created_at).toLocaleString())}</td>
                  <td class="muted" data-label="Remark">${APP.escapeHtml(a.manager_note || "")}</td>
                  <td class="right" data-label="Action">
                    <a href="/writer/editor.html?id=${encodeURIComponent(a.id)}"><button class="secondary">${canEdit ? "Edit" : "View"}</button></a>
                  </td>
                </tr>`;
            })
            .join("");
          focusRequestedArticle();
        }

        function updatePager() {
          const page = Math.floor(offset / pageSize) + 1;
          const pages = total ? Math.max(1, Math.ceil(total / pageSize)) : null;
          document.getElementById("prev").disabled = offset <= 0;
          document.getElementById("next").disabled = total != null ? offset + pageSize >= total : false;
          document.getElementById("pageInfo").textContent = pages ? `Page ${page} of ${pages}` : `Page ${page}`;
        }

        async function refreshRequests() {
          APP.ui.tableSkeleton("requestRows", { rows: 4, cols: 5 });
          const out = await APP.apiFetch("/api/requests");
          const requests = out.requests || [];
          document.getElementById("requestRows").innerHTML = requests.length
            ? requests
                .map(
                  (r) => `<tr data-request-row="${r.id}">
                    <td data-label="Request"><strong>${APP.escapeHtml(r.title || "")}</strong><div class="muted">${APP.escapeHtml((r.brief || "").slice(0, 120))}</div></td>
                    <td class="muted" data-label="Due">${r.due_at ? APP.escapeHtml(new Date(r.due_at).toLocaleString()) : "-"}</td>
                    <td data-label="Extra pay">${r.additional_payment ? `&#8377;${APP.escapeHtml(r.additional_payment)}` : "-"}</td>
                    <td data-label="Status">${APP.badgeForStatus(r.recipient_status || r.status || "open")}</td>
                    <td class="right" data-label="Action">
                      ${
                        r.recipient_status === "pending"
                          ? `<button class="secondary" data-accept-request="${r.id}">Accept</button><button class="danger" data-reject-request="${r.id}">Reject</button>`
                          : ""
                      }
                    </td>
                  </tr>`
                )
                .join("")
            : "<tr><td colspan='5' class='muted'>No writing requests yet.</td></tr>";
          focusRequestedRequest();

          for (const b of document.querySelectorAll("button[data-accept-request],button[data-reject-request]")) {
            b.onclick = async () => {
              const requestId = b.getAttribute("data-accept-request") || b.getAttribute("data-reject-request");
              const action = b.hasAttribute("data-accept-request") ? "accepted" : "rejected";
              await APP.apiFetch(`/api/requests/${encodeURIComponent(requestId)}/respond`, {
                method: "POST",
                body: JSON.stringify({ action })
              });
              await refreshRequests();
            };
          }
        }

        async function loadPage() {
          APP.ui.tableSkeleton("rows", { rows: 8, cols: 8 });
          const list = await APP.apiFetch(`/api/articles?limit=${pageSize}&offset=${offset}`);
          total = list.total ?? total;
          renderRows(list.articles || []);
          updatePager();
        }

        document.getElementById("prev").onclick = async () => {
          offset = Math.max(0, offset - pageSize);
          await loadPage();
        };
        document.getElementById("next").onclick = async () => {
          offset = offset + pageSize;
          await loadPage();
        };

        const [stats, projects, list] = await Promise.all([
          APP.apiFetch("/api/articles/stats/me"),
          APP.apiFetch("/api/projects"),
          APP.apiFetch(`/api/articles?limit=${pageSize}&offset=${offset}`),
          refreshRequests()
        ]);
        APP.setText("nApproved", stats.counts.approved || 0);
        APP.setText("nRejected", stats.counts.rejected || 0);
        APP.setText("nRework", stats.counts.rework || 0);
        projectName = new Map((projects.projects || []).map((p) => [p.id, p.title]));
        total = list.total ?? total;
        renderRows(list.articles || []);
        updatePager();
      })();
    </script>
  </body>
</html>
