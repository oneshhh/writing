<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write - Profile</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap profile-page">
      <div class="grid">
        <div class="card profile-card">
          <div class="profile-card-head">
            <div>
              <h2>Profile</h2>
              <div class="muted">Your account details</div>
            </div>
            <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
          </div>

          <div class="profile-summary">
            <div class="profile-avatar" id="profileAvatar">U</div>
            <div>
              <div class="profile-name" id="profileName">User</div>
              <div class="profile-role" id="profileRole">role</div>
            </div>
          </div>

          <div class="profile-fields">
            <div class="profile-field">
              <span class="material-symbols-outlined" aria-hidden="true">badge</span>
              <div>
                <label>First name</label>
                <div id="firstName">-</div>
              </div>
            </div>
            <div class="profile-field">
              <span class="material-symbols-outlined" aria-hidden="true">mail</span>
              <div>
                <label>Email</label>
                <div id="email">-</div>
              </div>
            </div>
            <div class="profile-field">
              <span class="material-symbols-outlined" aria-hidden="true">fingerprint</span>
              <div>
                <label>User ID</label>
                <div id="uniqueId">-</div>
              </div>
            </div>
          </div>
        </div>

        <div class="card profile-password-card">
          <div class="profile-card-head">
            <div>
              <h2>Change Password</h2>
              <div class="muted">Use a strong password only you know</div>
            </div>
            <span class="material-symbols-outlined" aria-hidden="true">lock_reset</span>
          </div>
          <form id="passwordForm" style="display:grid;gap:12px">
            <div>
              <label class="muted">Current password</label>
              <input id="currentPassword" type="password" autocomplete="current-password" />
            </div>
            <div class="two">
              <div>
                <label class="muted">New password</label>
                <input id="newPassword" type="password" autocomplete="new-password" />
              </div>
              <div>
                <label class="muted">Confirm new password</label>
                <input id="confirmPassword" type="password" autocomplete="new-password" />
              </div>
            </div>
            <div class="password-rules" id="passwordRules"></div>
            <div class="right">
              <button id="savePassword" type="submit">Update password</button>
            </div>
            <div class="muted" id="msg"></div>
          </form>
        </div>
      </div>
    </div>

    <script>
      (async function () {
        const user = await APP.requireAuth();
        if (!user) return;

        const linksByRole = {
          admin: [
            { href: "/admin/dashboard.html", label: "Dashboard" },
            { href: "/admin/users.html", label: "Users" },
            { href: "/admin/projects.html", label: "Projects" },
            { href: "/admin/payments.html", label: "Payments" }
          ],
          manager: [
            { href: "/manager/dashboard.html", label: "Dashboard" },
            { href: "/manager/review.html", label: "Review" },
            { href: "/manager/payments.html", label: "Payments" }
          ],
          writer: [
            { href: "/writer/dashboard.html", label: "Dashboard" },
            { href: "/writer/earnings.html", label: "Earnings" }
          ]
        };
        await renderTopbar({ role: user.role, links: linksByRole[user.role] || [] });

        const profileOut = await APP.apiFetch("/api/profile");
        const profile = profileOut.profile || {};
        const firstName = profile.first_name || String(profile.full_name || "").trim().split(/\s+/)[0] || "";
        const displayName = profile.full_name || firstName || "User";
        document.getElementById("profileAvatar").textContent = String(firstName || displayName || "U").slice(0, 1).toUpperCase();
        document.getElementById("profileName").textContent = displayName;
        document.getElementById("profileRole").textContent = profile.role || "role";
        document.getElementById("firstName").textContent = firstName || "-";
        document.getElementById("email").textContent = profile.email || "-";
        document.getElementById("uniqueId").textContent = profile.unique_id || "-";

        const currentPassword = document.getElementById("currentPassword");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        const rulesEl = document.getElementById("passwordRules");
        const msgEl = document.getElementById("msg");
        const saveBtn = document.getElementById("savePassword");

        function passwordProblems(value) {
          const password = String(value || "");
          const lower = password.toLowerCase();
          const emailName = String(profile.email || "").toLowerCase().split("@")[0] || "";
          const nameParts = String(profile.full_name || "")
            .toLowerCase()
            .split(/\s+/)
            .map((part) => part.trim())
            .filter((part) => part.length >= 3);
          const weakTerms = ["password", "qwerty", "welcome", "letmein", "admin", "realwrite"];
          const checks = [
            { ok: password.length >= 12, text: "At least 12 characters" },
            { ok: !/\s/.test(password), text: "No spaces" },
            { ok: /[a-z]/.test(password), text: "Lowercase letter" },
            { ok: /[A-Z]/.test(password), text: "Uppercase letter" },
            { ok: /\d/.test(password), text: "Number" },
            { ok: /[^A-Za-z0-9]/.test(password), text: "Symbol" },
            { ok: !emailName || emailName.length < 3 || !lower.includes(emailName), text: "Does not include your email name" },
            { ok: !nameParts.some((part) => lower.includes(part)), text: "Does not include your name" },
            { ok: !weakTerms.some((term) => lower.includes(term)), text: "Avoids common password words" }
          ];
          return checks;
        }

        function renderRules() {
          const checks = passwordProblems(newPassword.value);
          const mismatch = confirmPassword.value && newPassword.value !== confirmPassword.value;
          const missingFields = !currentPassword.value || !newPassword.value || !confirmPassword.value;
          rulesEl.innerHTML = checks
            .map(
              (check) => `
                <div class="password-rule ${check.ok ? "ok" : ""}">
                  <span class="material-symbols-outlined" aria-hidden="true">${check.ok ? "check_circle" : "radio_button_unchecked"}</span>
                  <span>${APP.escapeHtml(check.text)}</span>
                </div>
              `
            )
            .join("");
          if (mismatch) {
            rulesEl.innerHTML += `
              <div class="password-rule bad">
                <span class="material-symbols-outlined" aria-hidden="true">error</span>
                <span>Passwords match</span>
              </div>
            `;
          }
          saveBtn.disabled = checks.some((check) => !check.ok) || missingFields || newPassword.value !== confirmPassword.value;
        }

        currentPassword.addEventListener("input", renderRules);
        newPassword.addEventListener("input", renderRules);
        confirmPassword.addEventListener("input", renderRules);
        renderRules();

        document.getElementById("passwordForm").onsubmit = async (e) => {
          e.preventDefault();
          msgEl.textContent = "";
          renderRules();
          if (saveBtn.disabled) {
            msgEl.textContent = "Please complete the password requirements first.";
            return;
          }
          try {
            await APP.apiFetch("/api/profile/password", {
              method: "PATCH",
              body: JSON.stringify({
                current_password: currentPassword.value,
                new_password: newPassword.value,
                confirm_password: confirmPassword.value
              })
            });
            currentPassword.value = "";
            newPassword.value = "";
            confirmPassword.value = "";
            renderRules();
            msgEl.textContent = "Password updated.";
          } catch (err) {
            msgEl.textContent = err.message || String(err);
          }
        };
      })();
    </script>
  </body>
</html>
