<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write • Writer • Editor</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="network-toast hidden" id="networkToast" role="alert" aria-live="assertive">
      <span class="material-symbols-outlined" aria-hidden="true">wifi_off</span>
      <div>
        <strong id="networkToastTitle">Network connection lost</strong>
        <div id="networkToastBody">Keep this tab open. Your writing is being saved locally and will sync when the connection returns.</div>
      </div>
    </div>
    <div class="grammar-popover hidden" id="grammarPopover" role="dialog" aria-live="polite"></div>
    <div class="wrap wide">
      <div class="grid">
        <div class="card" style="grid-column: span 12">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <h2 style="margin:0">Article</h2>
            <a href="/writer/dashboard.html"><button class="secondary" type="button">Back</button></a>
          </div>
          <div class="two">
            <div>
              <label class="muted">Title</label>
              <input id="title" />
            </div>
            <div>
              <label class="muted">SEO tags (comma separated)</label>
              <input id="tags" placeholder="tag1, tag2" />
            </div>
          </div>
          <div style="margin-top: 10px">
            <label class="muted">Short description</label>
            <textarea id="short"></textarea>
            <div class="muted" style="margin-top:6px; display:flex; justify-content:flex-end;">
              <span id="shortWords">0 words</span>
            </div>
          </div>
          <div style="margin-top: 10px">
            <label class="muted">Long description</label>
            <div id="editor"></div>
            <div class="muted editor-meter-row">
              <div class="editor-meter-left">
                <span class="autosave-status is-idle" id="autosaveStatus" aria-live="polite">
                  <span class="material-symbols-outlined autosave-icon" id="autosaveIcon" aria-hidden="true">cloud_done</span>
                  <span id="autosaveText">Saved</span>
                </span>
                <label class="grammar-toggle" title="Grammar suggestions">
                  <input id="grammarToggle" type="checkbox" />
                  <span>Grammar</span>
                </label>
                <span class="grammar-status" id="grammarStatus">Off</span>
              </div>
              <span id="longWords">0 words</span>
            </div>
          </div>
          <div class="right" style="margin-top: 12px">
            <span class="badge" id="statusBadge"></span>
            <button class="secondary" id="save">Save draft</button>
            <button id="submit">Submit</button>
          </div>
          <div id="checks" style="margin-top: 10px; display:flex; gap:10px; flex-wrap:wrap;"></div>
          <div id="remark" class="muted" style="margin-top: 10px"></div>
          <div class="muted" id="msg" style="margin-top: 10px"></div>
        </div>
      </div>
    </div>
    <script>
      (async function () {
        const user = await APP.requireRole("writer");
        if (!user) return;
        await renderTopbar({ role: user.role, links: [{ href: "/writer/dashboard.html", label: "Dashboard" }] });

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        if (!id) { window.location.href = "/writer/dashboard.html"; return; }

        const Inline = Quill.import("blots/inline");
        class GrammarIssueBlot extends Inline {
          static create(value) {
            const node = super.create();
            node.setAttribute("data-grammar-id", value);
            return node;
          }

          static formats(node) {
            return node.getAttribute("data-grammar-id");
          }
        }
        GrammarIssueBlot.blotName = "grammarIssue";
        GrammarIssueBlot.tagName = "span";
        GrammarIssueBlot.className = "grammar-issue";
        Quill.register(GrammarIssueBlot);

        const quill = new Quill("#editor", {
          theme: "snow",
          placeholder: "Write your article here...",
          modules: {
            toolbar: [
              [{ font: [] }, { size: ["small", false, "large", "huge"] }],
              [{ header: [1, 2, 3, 4, 5, 6, false] }],
              ["bold", "italic", "underline", "strike"],
              [{ color: [] }, { background: [] }],
              [{ script: "sub" }, { script: "super" }],
              [{ list: "ordered" }, { list: "bullet" }, { indent: "-1" }, { indent: "+1" }],
              [{ direction: "rtl" }, { align: [] }],
              ["blockquote", "code-block"],
              ["link", "image"],
              ["clean"]
            ]
          },
          clipboard: { matchVisual: false },
          history: { delay: 900, maxStack: 120, userOnly: true }
        });
        quill.enable(false);

        const msg = (t) => (document.getElementById("msg").textContent = t || "");
        const AUTOSAVE_DELAY_MS = 3000;
        const GRAMMAR_DELAY_MS = 1400;
        const GRAMMAR_LANGUAGE = "en-US";
        const autosaveStatus = document.getElementById("autosaveStatus");
        const autosaveIcon = document.getElementById("autosaveIcon");
        const autosaveText = document.getElementById("autosaveText");
        const grammarToggle = document.getElementById("grammarToggle");
        const grammarStatus = document.getElementById("grammarStatus");
        const grammarPopover = document.getElementById("grammarPopover");
        let autosaveTimer = null;
        let autosaveInFlight = false;
        let autosaveQueued = false;
        let autosavePromise = Promise.resolve();
        let autosaveReady = false;
        let lastSavedSnapshot = "";
        let grammarTimer = null;
        let grammarRequestSeq = 0;
        let grammarIssues = [];
        let grammarEnabled = window.localStorage.getItem("rw:grammar-enabled") === "true";

        const countWords = (text) => {
          const t = String(text || "").replace(/\s+/g, " ").trim();
          if (!t) return 0;
          return t.split(" ").length;
        };

        const renderShortCount = () => {
          const n = countWords(document.getElementById("short").value);
          document.getElementById("shortWords").textContent = `${n} word${n === 1 ? "" : "s"}`;
        };

        const renderLongCount = () => {
          // Quill getText includes a trailing newline; trim handles it.
          const n = countWords(quill.getText());
          document.getElementById("longWords").textContent = `${n} word${n === 1 ? "" : "s"}`;
        };

        const cleanEditorHtml = () => {
          const clone = quill.root.cloneNode(true);
          for (const marker of clone.querySelectorAll("span.grammar-issue")) {
            const parent = marker.parentNode;
            while (marker.firstChild) parent.insertBefore(marker.firstChild, marker);
            parent.removeChild(marker);
          }
          return clone.innerHTML;
        };

        const getDraftPayload = () => ({
          title: document.getElementById("title").value.trim(),
          short_description: document.getElementById("short").value,
          long_description: cleanEditorHtml(),
          seo_tags: document.getElementById("tags").value
            .split(",")
            .map((t) => t.trim())
            .filter(Boolean)
        });

        const getDraftSnapshot = () => JSON.stringify(getDraftPayload());

        const setAutosaveState = (state, text) => {
          const iconByState = {
            idle: "cloud_done",
            unsaved: "cloud_queue",
            saving: "cloud_sync",
            saved: "cloud_done",
            local: "cloud_off",
            syncing: "cloud_sync",
            error: "cloud_off"
          };
          autosaveStatus.className = `autosave-status ${state === "idle" ? "is-idle" : state}`;
          autosaveIcon.textContent = iconByState[state] || "cloud_done";
          autosaveText.textContent = text || {
            idle: "Saved",
            unsaved: "Autosave pending",
            saving: "Saving...",
            saved: "Saved",
            local: "Saved locally",
            syncing: "Syncing...",
            error: "Autosave failed"
          }[state] || "Saved";
        };

        const localDraftKey = () => `rw:article-draft:${user.id}:${id}`;
        const readLocalDraft = () => {
          try {
            const raw = window.localStorage.getItem(localDraftKey());
            return raw ? JSON.parse(raw) : null;
          } catch (e) {
            return null;
          }
        };

        const writeLocalDraft = ({ synced = false } = {}) => {
          if (!autosaveReady) return;
          try {
            window.localStorage.setItem(localDraftKey(), JSON.stringify({
              article_id: id,
              user_id: user.id,
              payload: getDraftPayload(),
              snapshot: getDraftSnapshot(),
              synced,
              updatedAt: Date.now()
            }));
          } catch (e) {
            // localStorage can fail when storage is full or disabled; server autosave still protects online users.
          }
        };

        const clearLocalDraft = () => {
          try { window.localStorage.removeItem(localDraftKey()); } catch (e) {}
        };

        const applyDraftPayload = (payload) => {
          if (!payload) return;
          document.getElementById("title").value = payload.title || "";
          document.getElementById("short").value = payload.short_description || "";
          document.getElementById("tags").value = Array.isArray(payload.seo_tags) ? payload.seo_tags.join(", ") : "";
          quill.root.innerHTML = payload.long_description || "";
          renderShortCount();
          renderLongCount();
        };

        const showNetworkToast = (title, body, mode = "offline") => {
          const toast = document.getElementById("networkToast");
          toast.className = `network-toast ${mode}`;
          document.getElementById("networkToastTitle").textContent = title;
          document.getElementById("networkToastBody").textContent = body;
        };

        const hideNetworkToastSoon = () => {
          const toast = document.getElementById("networkToast");
          toast.classList.add("online");
          setTimeout(() => toast.classList.add("hidden"), 2400);
        };

        const markOfflineDraft = () => {
          writeLocalDraft({ synced: false });
          setAutosaveState("local", "Saved locally");
          showNetworkToast(
            "Network connection lost",
            "Keep this tab open. Your writing is saved locally and will sync when the connection returns.",
            "offline"
          );
        };

        const setGrammarStatus = (text, state = "") => {
          grammarStatus.textContent = text;
          grammarStatus.className = `grammar-status ${state}`.trim();
        };

        const hideGrammarPopover = () => {
          grammarPopover.classList.add("hidden");
          grammarPopover.innerHTML = "";
        };

        const clearGrammarIssues = () => {
          clearTimeout(grammarTimer);
          grammarIssues = [];
          hideGrammarPopover();
          if (quill.getLength() > 1) {
            quill.formatText(0, quill.getLength(), "grammarIssue", false, "silent");
          }
        };

        const applyGrammarIssues = (matches) => {
          clearGrammarIssues();
          grammarIssues = (matches || [])
            .filter((match) => Number.isFinite(match.offset) && Number.isFinite(match.length) && match.length > 0)
            .filter((match) => Array.isArray(match.replacements) && match.replacements.length)
            .slice(0, 60)
            .map((match, index) => ({
              id: `grammar-${grammarRequestSeq}-${index}`,
              offset: match.offset,
              length: match.length,
              message: match.message || "Grammar suggestion",
              shortMessage: match.shortMessage || "",
              replacements: match.replacements.slice(0, 5).map((replacement) => String(replacement.value || "")).filter(Boolean)
            }))
            .filter((issue) => issue.replacements.length);

          for (const issue of grammarIssues) {
            quill.formatText(issue.offset, issue.length, "grammarIssue", issue.id, "silent");
          }

          setGrammarStatus(grammarIssues.length ? `${grammarIssues.length} issue${grammarIssues.length === 1 ? "" : "s"}` : "No issues", grammarIssues.length ? "issues" : "ok");
        };

        const runGrammarCheck = async () => {
          if (!grammarEnabled || !autosaveReady) return;
          hideGrammarPopover();
          if (!navigator.onLine) {
            clearGrammarIssues();
            setGrammarStatus("Offline", "muted");
            return;
          }

          const text = quill.getText();
          if (!text.trim() || text.trim().length < 3) {
            clearGrammarIssues();
            setGrammarStatus("No issues", "ok");
            return;
          }

          const requestSeq = ++grammarRequestSeq;
          setGrammarStatus("Checking...", "checking");
          try {
            const result = await APP.apiFetch("/api/grammar/check", {
              method: "POST",
              body: JSON.stringify({ text, language: GRAMMAR_LANGUAGE }),
              skipLoader: true
            });
            if (requestSeq !== grammarRequestSeq || !grammarEnabled) return;
            if (result.enabled === false) {
              clearGrammarIssues();
              setGrammarStatus("Unavailable", "muted");
              return;
            }
            applyGrammarIssues(result.matches || []);
          } catch (e) {
            if (requestSeq !== grammarRequestSeq || !grammarEnabled) return;
            clearGrammarIssues();
            setGrammarStatus("Unavailable", "muted");
          }
        };

        const scheduleGrammarCheck = () => {
          if (!grammarEnabled || !autosaveReady) return;
          clearTimeout(grammarTimer);
          grammarTimer = setTimeout(runGrammarCheck, GRAMMAR_DELAY_MS);
        };

        const replaceGrammarIssue = (issue, replacement) => {
          if (!issue || !replacement) return;
          clearGrammarIssues();
          quill.deleteText(issue.offset, issue.length, "user");
          quill.insertText(issue.offset, replacement, "user");
          quill.setSelection(issue.offset + replacement.length, 0, "silent");
          scheduleAutosave();
          scheduleGrammarCheck();
        };

        const showGrammarPopover = (issue, target) => {
          if (!issue) return;
          const replacements = issue.replacements
            .map((replacement, index) => `<button type="button" data-replacement="${index}">${APP.escapeHtml(replacement)}</button>`)
            .join("");
          grammarPopover.innerHTML = `
            <div class="grammar-popover-title">${APP.escapeHtml(issue.shortMessage || "Suggestion")}</div>
            <div class="grammar-popover-message">${APP.escapeHtml(issue.message)}</div>
            <div class="grammar-popover-actions">${replacements}</div>
          `;

          const rect = target.getBoundingClientRect();
          const width = 300;
          const left = Math.max(14, Math.min(window.innerWidth - width - 14, rect.left));
          const top = Math.max(84, rect.bottom + 8);
          grammarPopover.style.left = `${left}px`;
          grammarPopover.style.top = `${top}px`;
          grammarPopover.classList.remove("hidden");

          for (const button of grammarPopover.querySelectorAll("button[data-replacement]")) {
            button.onclick = () => replaceGrammarIssue(issue, issue.replacements[Number(button.getAttribute("data-replacement"))]);
          }
        };

        const scheduleAutosave = () => {
          if (!autosaveReady) return;
          writeLocalDraft({ synced: false });
          clearTimeout(autosaveTimer);
          if (getDraftSnapshot() === lastSavedSnapshot) {
            setAutosaveState("saved");
            return;
          }
          setAutosaveState("unsaved");
          autosaveTimer = setTimeout(() => autosave(), AUTOSAVE_DELAY_MS);
        };

        async function persistDraft({ skipLoader = false } = {}) {
          const body = getDraftPayload();
          const snapshot = JSON.stringify(body);
          const updated = await APP.apiFetch(`/api/articles/${encodeURIComponent(id)}`, {
            method: "PATCH",
            body: JSON.stringify(body),
            skipLoader
          });
          lastSavedSnapshot = snapshot;
          document.getElementById("statusBadge").innerHTML = APP.badgeForStatus(updated.article.status);
          setAutosaveState("saved");
          if (getDraftSnapshot() === snapshot) {
            clearLocalDraft();
          } else {
            writeLocalDraft({ synced: false });
          }
          return updated;
        }

        async function autosave() {
          if (!autosaveReady) return;
          const snapshot = getDraftSnapshot();
          if (snapshot === lastSavedSnapshot) {
            setAutosaveState("saved");
            return;
          }
          if (!navigator.onLine) {
            markOfflineDraft();
            return;
          }
          if (autosaveInFlight) {
            autosaveQueued = true;
            return;
          }

          autosaveInFlight = true;
          autosaveQueued = false;
          setAutosaveState("saving");
          let autosaveFailed = false;

          try {
            autosavePromise = persistDraft({ skipLoader: true });
            await autosavePromise;
          } catch (e) {
            autosaveFailed = true;
            markOfflineDraft();
          } finally {
            autosaveInFlight = false;
            if (autosaveQueued || getDraftSnapshot() !== lastSavedSnapshot) {
              if (autosaveFailed) {
                clearTimeout(autosaveTimer);
                if (navigator.onLine) autosaveTimer = setTimeout(() => autosave(), AUTOSAVE_DELAY_MS);
              } else {
                scheduleAutosave();
              }
            }
          }
        }

        async function waitForAutosaveIdle() {
          clearTimeout(autosaveTimer);
          if (autosaveInFlight) {
            try { await autosavePromise; } catch (e) {}
          }
        }

        const syncLocalDraft = async () => {
          if (!autosaveReady || !navigator.onLine) return;
          const localDraft = readLocalDraft();
          if (!localDraft || localDraft.synced) return;
          setAutosaveState("syncing", "Syncing...");
          showNetworkToast("Connection restored", "Syncing your local draft to the database.", "online");
          try {
            applyDraftPayload(localDraft.payload);
            await persistDraft({ skipLoader: true });
            hideNetworkToastSoon();
          } catch (e) {
            markOfflineDraft();
          }
        };

        APP.ui.textSkeleton("statusBadge", { kind: "line", width: "80px" });
        document.getElementById("title").disabled = true;
        document.getElementById("tags").disabled = true;
        document.getElementById("short").disabled = true;
        document.getElementById("save").disabled = true;
        document.getElementById("submit").disabled = true;

        const list = await APP.apiFetch("/api/articles");
        const article = (list.articles || []).find((a) => a.id === id);
        if (!article) { msg("Article not found."); return; }

        document.getElementById("title").value = article.title || "";
        document.getElementById("short").value = article.short_description || "";
        document.getElementById("tags").value = Array.isArray(article.seo_tags) ? article.seo_tags.join(", ") : "";
        quill.root.innerHTML = article.long_description || "";
        document.getElementById("statusBadge").innerHTML = APP.badgeForStatus(article.status);
        document.getElementById("checks").innerHTML = `
          <span class="pill">AI: ${APP.checkBadge(article.ai_score)}</span>
          <span class="pill">Plagiarism: ${APP.checkBadge(article.plagiarism_score)}</span>
        `;
        document.getElementById("remark").textContent =
          article.manager_note ? `Remark from manager: ${article.manager_note}` : "";

        renderShortCount();
        renderLongCount();

        const canEdit = article.status === "draft" || article.status === "rework";
        let restoredLocalDraft = false;
        const localDraft = readLocalDraft();
        if (canEdit && localDraft?.payload && localDraft.synced === false) {
          const localUpdatedAt = Number(localDraft.updatedAt || 0);
          const serverUpdatedAt = Date.parse(article.updated_at || article.created_at || "") || 0;
          if (localUpdatedAt > serverUpdatedAt) {
            applyDraftPayload(localDraft.payload);
            restoredLocalDraft = true;
            showNetworkToast(
              "Local draft restored",
              "We found unsynced changes in this browser. Keep this tab open while it syncs.",
              navigator.onLine ? "online" : "offline"
            );
          } else {
            clearLocalDraft();
          }
        }
        if (!canEdit) {
          document.getElementById("save").disabled = true;
          document.getElementById("submit").disabled = true;
          grammarToggle.disabled = true;
          grammarEnabled = false;
          grammarToggle.checked = false;
          setGrammarStatus("Off");
          msg("This article is read-only in its current status.");
          setAutosaveState("idle");
        } else {
          document.getElementById("title").disabled = false;
          document.getElementById("tags").disabled = false;
          document.getElementById("short").disabled = false;
          document.getElementById("save").disabled = false;
          document.getElementById("submit").disabled = false;
          grammarToggle.checked = grammarEnabled;
          setGrammarStatus(grammarEnabled ? "Ready" : "Off");
          quill.enable(true);
          lastSavedSnapshot = getDraftSnapshot();
          autosaveReady = true;
          if (restoredLocalDraft) {
            setAutosaveState(navigator.onLine ? "syncing" : "local", navigator.onLine ? "Syncing..." : "Saved locally");
            syncLocalDraft();
          } else {
            setAutosaveState("saved");
          }
          if (grammarEnabled) scheduleGrammarCheck();
        }

        document.getElementById("title").addEventListener("input", scheduleAutosave);
        document.getElementById("tags").addEventListener("input", scheduleAutosave);
        document.getElementById("short").addEventListener("input", () => {
          renderShortCount();
          scheduleAutosave();
        });
        quill.on("text-change", (_delta, _oldDelta, source) => {
          renderLongCount();
          if (source === "user") {
            clearGrammarIssues();
            scheduleAutosave();
            scheduleGrammarCheck();
          }
        });
        quill.root.addEventListener("click", (e) => {
          const marker = e.target.closest(".grammar-issue");
          if (!marker) return;
          const issue = grammarIssues.find((item) => item.id === marker.getAttribute("data-grammar-id"));
          if (!issue) return;
          e.preventDefault();
          showGrammarPopover(issue, marker);
        });
        document.addEventListener("click", (e) => {
          if (grammarPopover.classList.contains("hidden")) return;
          if (grammarPopover.contains(e.target) || e.target.closest(".grammar-issue")) return;
          hideGrammarPopover();
        });
        grammarToggle.addEventListener("change", () => {
          grammarEnabled = grammarToggle.checked;
          window.localStorage.setItem("rw:grammar-enabled", grammarEnabled ? "true" : "false");
          clearGrammarIssues();
          if (grammarEnabled) {
            setGrammarStatus("Ready");
            scheduleGrammarCheck();
          } else {
            setGrammarStatus("Off");
          }
        });

        window.addEventListener("offline", () => {
          if (autosaveReady) markOfflineDraft();
          if (grammarEnabled) {
            clearGrammarIssues();
            setGrammarStatus("Offline", "muted");
          }
        });
        window.addEventListener("online", () => {
          if (autosaveReady) syncLocalDraft();
          if (grammarEnabled) scheduleGrammarCheck();
        });
        window.addEventListener("beforeunload", (e) => {
          const localDraft = readLocalDraft();
          if (localDraft && localDraft.synced === false) {
            e.preventDefault();
            e.returnValue = "";
          }
        });

        document.getElementById("save").onclick = async () => {
          msg("");
          try {
            await waitForAutosaveIdle();
            if (!navigator.onLine) {
              markOfflineDraft();
              msg("Saved locally. It will sync when the connection returns.");
              return;
            }
            await persistDraft();
            msg("Saved.");
          } catch (e) {
            markOfflineDraft();
            msg(e.message || String(e));
          }
        };
        document.getElementById("submit").onclick = async () => {
          msg("");
          try {
            await APP.ui.runActionOverlay({
              title: "Submitting...",
              sub: "Sending to manager review",
              successSymbol: "check_circle",
              errorSymbol: "error",
              action: async () => {
                await waitForAutosaveIdle();
                if (!navigator.onLine) throw new Error("You are offline. Keep this tab open until the draft syncs, then submit.");
                await persistDraft({ skipLoader: true });
                return APP.apiFetch(`/api/articles/${encodeURIComponent(id)}/submit`, { method: "POST", skipLoader: true });
              }
            });
            msg("Submitted to manager.");
            setTimeout(() => (window.location.href = "/writer/dashboard.html"), 600);
          } catch (e) {
            msg(e.message || String(e));
          }
        };
      })();
    </script>
  </body>
</html>
