<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write - Writer Calendar</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap wide">
      <main class="calendar-page">
        <section class="calendar-hero">
          <div>
            <h1>Editorial Calendar</h1>
            <p>Track your submissions, approvals, request deadlines, and personal milestones for this month.</p>
          </div>
          <div class="calendar-controls">
            <div class="calendar-month-nav" aria-label="Calendar month navigation">
              <button id="prevMonth" type="button" aria-label="Previous month">
                <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
              </button>
              <strong id="monthLabel"></strong>
              <button id="nextMonth" type="button" aria-label="Next month">
                <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
              </button>
            </div>
            <button class="secondary" id="todayRange" type="button">Today</button>
          </div>
        </section>

        <section class="calendar-legend" aria-label="Calendar legend">
          <span class="calendar-legend-item"><span class="planner-count">03</span> Articles submitted</span>
          <span class="calendar-legend-item"><span class="planner-approved"><span class="material-symbols-outlined" aria-hidden="true">check</span></span> Articles approved</span>
          <span class="calendar-legend-item"><span class="planner-due">02</span> Requests due</span>
          <span class="calendar-legend-item"><span class="material-symbols-outlined" aria-hidden="true">edit_note</span> Personal milestone</span>
        </section>

        <section class="calendar-shell">
          <div class="calendar-weekdays" aria-hidden="true">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div id="plannerGrid" class="planner-grid"></div>
        </section>
      </main>
    </div>

    <dialog id="noteDlg" style="border:0;border-radius:18px;box-shadow:0 26px 70px rgba(0,0,0,.18);padding:0;max-width:min(520px,calc(100vw - 32px));">
      <form method="dialog" style="margin:0;padding:16px;background:rgba(255,255,255,.94);border:1px solid rgba(229,226,225,0.9);border-radius:18px;">
        <h3 style="margin:0">Add calendar note</h3>
        <div class="muted" id="noteDate" style="margin-top:4px"></div>
        <div style="margin-top:12px">
          <label class="muted">Title</label>
          <input id="noteTitle" />
        </div>
        <div style="margin-top:10px">
          <label class="muted">Note</label>
          <textarea id="noteBody"></textarea>
        </div>
        <div class="right" style="margin-top:14px">
          <button class="secondary" value="cancel" type="submit">Cancel</button>
          <button value="ok" type="submit">Save note</button>
        </div>
        <div class="muted" id="noteMsg" style="margin-top:10px"></div>
      </form>
    </dialog>

    <script>
      (async function () {
        const user = await APP.requireRole("writer");
        if (!user) return;
        await renderTopbar({ role: user.role, links: [] });

        let cursor = new Date();
        cursor = new Date(cursor.getFullYear(), cursor.getMonth(), 1);

        function key(d) {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          return `${y}-${m}-${day}`;
        }

        function monthStart() {
          return new Date(cursor.getFullYear(), cursor.getMonth(), 1);
        }

        function monthDays() {
          return new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
        }

        function mondayOffset(d) {
          return (d.getDay() + 6) % 7;
        }

        function monthLabel() {
          return cursor.toLocaleDateString(undefined, { month: "long", year: "numeric" });
        }

        function dayCell(d, row, outside) {
          const today = key(d) === key(new Date());
          const submitted = Number(row.submitted || 0);
          const approved = Number(row.approved || 0);
          const due = Number(row.requests_due || 0);
          const dateKey = key(d);
          return `<button class="planner-day ${outside ? "is-outside" : ""} ${today ? "is-today" : ""}" data-day="${dateKey}" type="button">
            <div class="planner-date-row">
              <span class="planner-date">${d.getDate()}</span>
              <span class="planner-metrics">
                ${submitted ? `<span class="planner-count">${submitted}</span>` : ""}
                ${approved ? `<span class="planner-approved"><span class="material-symbols-outlined" aria-hidden="true">check</span></span>` : ""}
                ${due ? `<span class="planner-due">${due}</span>` : ""}
              </span>
            </div>
            <div>
              ${(row.notes || [])
                .slice(0, 2)
                .map((n) => `<span class="planner-note"><span class="material-symbols-outlined" aria-hidden="true">edit_note</span>${APP.escapeHtml(n.title)}</span>`)
                .join("")}
            </div>
          </button>`;
        }

        function render(days) {
          const map = new Map((days || []).map((day) => [day.date, day]));
          const first = monthStart();
          const leading = mondayOffset(first);
          const totalDays = monthDays();
          const totalCells = Math.ceil((leading + totalDays) / 7) * 7;
          const gridStart = new Date(first);
          gridStart.setDate(first.getDate() - leading);
          const cells = [];

          for (let i = 0; i < totalCells; i += 1) {
            const d = new Date(gridStart);
            d.setDate(gridStart.getDate() + i);
            const dateKey = key(d);
            const outside = d.getMonth() !== cursor.getMonth();
            const row = map.get(dateKey) || { date: dateKey, submitted: 0, approved: 0, requests_due: 0, notes: [] };
            cells.push(dayCell(d, row, outside));
          }

          document.getElementById("plannerGrid").innerHTML = cells.join("");
          document.getElementById("monthLabel").textContent = monthLabel();
          for (const cell of document.querySelectorAll("[data-day]")) {
            cell.onclick = () => openNote(cell.getAttribute("data-day"));
          }
        }

        async function load() {
          const out = await APP.apiFetch(`/api/calendar?start=${encodeURIComponent(key(monthStart()))}&days=${monthDays()}`);
          render(out.days || []);
        }

        function openNote(day) {
          const dlg = document.getElementById("noteDlg");
          document.getElementById("noteDate").textContent = day;
          document.getElementById("noteTitle").value = "";
          document.getElementById("noteBody").value = "";
          document.getElementById("noteMsg").textContent = "";
          const onClose = async () => {
            dlg.removeEventListener("close", onClose);
            if (dlg.returnValue !== "ok") return;
            try {
              await APP.apiFetch("/api/calendar/notes", {
                method: "POST",
                body: JSON.stringify({ event_date: day, title: document.getElementById("noteTitle").value.trim(), note: document.getElementById("noteBody").value })
              });
              await load();
            } catch (e) {
              document.getElementById("noteMsg").textContent = e.message || String(e);
              dlg.showModal();
              dlg.addEventListener("close", onClose);
            }
          };
          dlg.addEventListener("close", onClose);
          dlg.showModal();
        }

        document.getElementById("prevMonth").onclick = async () => {
          cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1);
          await load();
        };
        document.getElementById("nextMonth").onclick = async () => {
          cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
          await load();
        };
        document.getElementById("todayRange").onclick = async () => {
          const today = new Date();
          cursor = new Date(today.getFullYear(), today.getMonth(), 1);
          await load();
        };
        await load();
      })();
    </script>
  </body>
</html>
